# Hetzner installimage autosetup for a determinismo dev host (2 identical SATA/NVMe disks, RAID1).
DRIVE1 /dev/sda
DRIVE2 /dev/sdb
SWRAID 1
SWRAIDLEVEL 1
HOSTNAME determinismo-dev-1
BOOTLOADER grub
PART /boot ext4 1G
PART swap  swap 4G
PART /     ext4 all
IMAGE /root/.oldroot/nfs/images/Debian-1305-trixie-amd64-base.tar.zst
