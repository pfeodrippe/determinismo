<!doctype html>
<!-- SPDX-License-Identifier: MIT -->
<!-- determinismo's web UI, served by `determinismo serve` at /. One page, no build step, no
     dependencies: it reads the HTTP API (src/serve.zig) and updates live while runs go. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>determinismo</title>
<style>
:root {
  --bg: #15161a; --panel: #1d1f25; --panel-2: #24262e; --line: #30333d; --text: #e6e7eb;
  --muted: #9a9eab; --accent: #8f7cf7; --pass: #3fbf7f; --fail: #f0506e; --warn: #f0a650;
  --info: #5aa9f0; --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, sans-serif; }
a { color: var(--accent); cursor: pointer; text-decoration: none; }
button, input, select, textarea {
  font: inherit; color: var(--text); background: var(--panel-2); border: 1px solid var(--line);
  border-radius: 6px; padding: 6px 10px;
}
button { cursor: pointer; }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
input:focus, select:focus, textarea:focus { outline: 1px solid var(--accent); }
.layout { display: grid; grid-template-columns: 260px 1fr; min-height: 100vh; }
aside { background: var(--panel); border-right: 1px solid var(--line); padding: 16px; }
main { padding: 20px 28px; min-width: 0; }
h1 { font-size: 18px; margin: 0 0 14px; letter-spacing: .3px; }
h1 span { color: var(--accent); }
h2 { font-size: 20px; margin: 0; }
.runs { list-style: none; padding: 0; margin: 12px 0 0; }
.runs li { padding: 8px 10px; border-radius: 6px; cursor: pointer; display: flex; justify-content: space-between; }
.runs li:hover, .runs li.selected { background: var(--panel-2); }
.badge { font-size: 11px; padding: 2px 8px; border-radius: 10px; border: 1px solid; white-space: nowrap; }
.badge.pass { color: var(--pass); border-color: var(--pass); }
.badge.fail { color: var(--fail); border-color: var(--fail); }
.badge.running { color: var(--info); border-color: var(--info); }
.badge.error { color: var(--warn); border-color: var(--warn); }
.badge.stopped { color: var(--muted); border-color: var(--muted); }
section { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; margin: 14px 0; }
section > header { display: flex; align-items: baseline; gap: 12px; padding: 12px 16px; cursor: pointer; }
section > header h3 { margin: 0; font-size: 17px; color: #c9cbd3; }
section > header .summary { color: var(--muted); font-size: 13px; }
section > .body { padding: 4px 16px 16px; }
section.closed > .body { display: none; }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 4px 16px; font-size: 13px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; font-family: var(--mono); word-break: break-all; }
.progress { height: 6px; background: var(--panel-2); border-radius: 3px; overflow: hidden; margin-top: 10px; }
.progress div { height: 100%; background: var(--accent); transition: width .4s; }
.tabs { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.tabs button { border: 0; border-radius: 0; background: transparent; padding: 4px 12px; }
.tabs button.on { background: var(--panel-2); }
.group-title { margin: 14px 0 4px; color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .6px; }
.causality-legend { margin: 4px 0; font-size: 12px; }
.causality-options { margin: 8px 0 2px; font-size: 12px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.causality-options input { font-size: 12px; padding: 2px 4px; margin-left: 4px; }
.causality-legend span { margin-left: 10px; }
.causality-jumps { margin: 6px 0; font-size: 13px; }
.causality-jumps > div { padding: 3px 0; }
.property { border-top: 1px solid var(--line); }
.property > .row { display: flex; align-items: center; gap: 10px; padding: 7px 4px; cursor: pointer; }
.property > .row .name { flex: 1; }
.property > .row .counts { color: var(--muted); font-size: 12px; font-family: var(--mono); }
.examples { margin: 0 0 10px 28px; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th { text-align: left; color: var(--muted); font-weight: 500; padding: 4px 8px; border-bottom: 1px solid var(--line); }
td { padding: 4px 8px; border-bottom: 1px solid #262830; vertical-align: top; }
tr.clickable { cursor: pointer; }
tr.clickable:hover { background: var(--panel-2); }
.mono { font-family: var(--mono); font-size: 12.5px; }
.fail-text { color: var(--fail); }
.pass-text { color: var(--pass); }
.muted { color: var(--muted); }
.search-form { display: grid; grid-template-columns: 1fr; gap: 8px; }
.search-form .temporal { display: grid; grid-template-columns: 180px 1fr 110px; gap: 8px; }
.search-form .actions { display: flex; gap: 8px; align-items: center; }
.logs { max-height: 560px; overflow: auto; border: 1px solid var(--line); border-radius: 6px; }
.logs table td { font-family: var(--mono); font-size: 12px; white-space: pre-wrap; word-break: break-word; }
.logs table td:first-child, .logs table td:nth-child(2) { white-space: nowrap; }
.logs tr.here { background: #3a2a44; }
.kind { font-size: 11px; padding: 1px 6px; border-radius: 4px; background: var(--panel-2); color: var(--muted); }
.kind.fault { color: var(--warn); }
.kind.assert-fail { color: var(--fail); }
.kind.assert { color: var(--pass); }
.kind.output { color: var(--info); }
.kind.command { color: var(--accent); }
.map { width: 100%; overflow-x: auto; }
.map svg { display: block; }
.legend { display: flex; gap: 16px; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: middle; }
dialog { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 10px; width: 520px; }
dialog::backdrop { background: rgba(0,0,0,.55); }
dialog form { display: grid; gap: 10px; }
dialog label { display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
/* Inputs in a row of columns shrink with them: their own width would widen the dialog. */
dialog label, dialog input, dialog select { min-width: 0; }
pre.output { background: #101114; border: 1px solid var(--line); border-radius: 6px; padding: 10px; max-height: 360px; overflow: auto; white-space: pre-wrap; font-size: 12px; }
.empty { color: var(--muted); padding: 30px; text-align: center; }
.view-tabs { margin: 14px 0 0; }
.cell { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; margin: 10px 0; }
.cell textarea { width: 100%; border: 0; border-radius: 8px 8px 0 0; background: #101114; font-family: var(--mono);
  font-size: 12.5px; resize: vertical; min-height: 44px; padding: 10px; }
.cell .out { padding: 8px 12px; font-size: 13px; }
.cell .out:empty { display: none; }
.cell .out pre { margin: 4px 0; white-space: pre-wrap; font-family: var(--mono); font-size: 12px; }
.cell .out .error { color: var(--fail); white-space: pre-wrap; font-family: var(--mono); font-size: 12px; }
.cell .tools { display: flex; gap: 6px; justify-content: flex-end; padding: 0 8px 8px; }
.cell .tools button { padding: 2px 8px; font-size: 12px; }
.notebook-bar { display: flex; gap: 8px; align-items: center; margin-top: 12px; }
.action { display: flex; align-items: center; gap: 10px; margin: 6px 0; }
.md h1, .md h2, .md h3 { margin: 6px 0; }
.md code { font-family: var(--mono); background: var(--panel-2); padding: 0 4px; border-radius: 4px; }
.brand { display: flex; align-items: center; gap: 10px; margin: 0 0 16px; font-size: 18px; font-weight: 600; }
.runs li .label { display: grid; }
.runs li .label small { color: var(--muted); font-size: 12px; }
.stats { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; margin-top: 16px; }
.stat { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 16px; }
.stat .title { color: var(--muted); font-size: 11.5px; text-transform: uppercase; letter-spacing: .6px; }
.stat .value { font-size: 28px; font-weight: 600; margin: 2px 0; font-variant-numeric: tabular-nums; }
.stat .note { color: var(--muted); font-size: 12px; }
.charts { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px; }
.chart { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 16px; min-width: 0; }
.chart .head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; }
.chart .head h3 { margin: 0; font-size: 15px; color: #c9cbd3; }
.chart .head span { color: var(--muted); font-size: 12px; }
.bars .bar { display: grid; grid-template-columns: minmax(0, 1fr) 40% 44px; gap: 10px; align-items: center; padding: 4px 0; font-size: 12.5px; cursor: pointer; }
.bars .bar .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bars .bar .track { height: 10px; border-radius: 5px; background: var(--panel-2); overflow: hidden; }
.bars .bar .fill { height: 100%; border-radius: 5px; background: var(--fail); }
.bars .bar .count { text-align: right; font-variant-numeric: tabular-nums; }
.tree svg .timeline:hover path, .tree svg .timeline:hover line { stroke-opacity: 1; stroke-width: 2.2; }
.empty svg { display: block; margin: 40px auto 18px; }
.tip { position: fixed; z-index: 50; pointer-events: none; max-width: 420px; background: #23252d; color: var(--text);
  border: 1px solid #3a3d48; border-radius: 10px; padding: 10px 12px; font-size: 12.5px; line-height: 1.45;
  box-shadow: 0 10px 30px rgba(0,0,0,.45); opacity: 0; transform: translateY(4px); transition: opacity .08s, transform .08s; }
.tip.on { opacity: 1; transform: none; }
.tip .t-title { font-weight: 600; font-size: 13px; display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
.tip .t-dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
.tip .t-path { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; margin: 4px 0; font-family: var(--mono); font-size: 11.5px; }
.tip .t-chip { background: var(--panel-2); border: 1px solid var(--line); border-radius: 5px; padding: 0 5px; }
.tip .t-kv { display: grid; grid-template-columns: max-content 1fr; gap: 1px 10px; margin: 4px 0; }
.tip .t-kv dt { color: var(--muted); } .tip .t-kv dd { margin: 0; font-family: var(--mono); font-size: 11.5px; word-break: break-word; }
.tip .t-why { margin-top: 6px; padding: 6px 8px; border-left: 2px solid var(--accent); background: rgba(143,124,247,.08); border-radius: 0 6px 6px 0; }
.tip .t-why b { color: var(--accent); font-weight: 600; }
.tip .t-foot { margin-top: 6px; color: var(--muted); font-size: 11px; }
.tip .t-fail { color: var(--fail); }
@media (max-width: 1100px) { .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } .charts { grid-template-columns: 1fr; } }
</style>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='7' cy='16' r='5' fill='%238f7cf7'/%3E%3Cpath d='M11 16C18 16 18 6 26 6M11 16H26M11 16C18 16 18 26 26 26' stroke='%238f7cf7' stroke-width='3' fill='none'/%3E%3Ccircle cx='27' cy='6' r='3.5' fill='%233fbf7f'/%3E%3Ccircle cx='27' cy='16' r='3.5' fill='%233fbf7f'/%3E%3Ccircle cx='27' cy='26' r='3.5' fill='%23f0506e'/%3E%3C/svg%3E">
</head>
<body>
<div class="layout">
  <aside>
    <div class="brand"><svg width="40" height="30" viewBox="0 0 40 30" aria-hidden="true">
      <circle cx="8" cy="15" r="5" fill="#8f7cf7"/>
      <path d="M13 15 C 22 15, 22 5, 32 5 M13 15 L32 15 M13 15 C 22 15, 22 25, 32 25" stroke="#8f7cf7" stroke-width="2.4" fill="none"/>
      <circle cx="33" cy="5" r="3" fill="#3fbf7f"/><circle cx="33" cy="15" r="3" fill="#3fbf7f"/><circle cx="33" cy="25" r="3" fill="#f0506e"/></svg>determinismo</div>
    <button class="primary" id="new-run" style="width:100%">New run</button>
    <ul class="runs" id="runs"></ul>
  </aside>
  <main id="main"><div class="empty">
    <svg width="360" height="170" viewBox="0 0 360 170" aria-hidden="true">
      <line x1="10" y1="85" x2="110" y2="85" stroke="#9a9eab" stroke-width="3"/>
      <g fill="none" stroke-width="2" stroke-opacity=".75">
        <path d="M110 85 C150 85 150 15 190 15 L340 15" stroke="#3fbf7f"/>
        <path d="M110 85 C150 85 150 45 190 45 L320 45" stroke="#3fbf7f"/>
        <path d="M110 85 L330 85" stroke="#f0506e"/>
        <path d="M110 85 C150 85 150 125 190 125 L345 125" stroke="#3fbf7f"/>
        <path d="M110 85 C150 85 150 155 190 155 L310 155" stroke="#3fbf7f"/>
        <path d="M240 45 C260 45 260 32 280 32 L330 32 M240 45 C260 45 260 58 280 58 L325 58" stroke="#8f7cf7"/>
      </g>
      <rect x="230" y="11" width="3" height="8" fill="#f0a650"/><rect x="270" y="121" width="3" height="8" fill="#f0a650"/>
      <rect x="205" y="81" width="3" height="8" fill="#f0a650"/><circle cx="262" cy="85" r="4.5" fill="#f0506e"/>
      <circle cx="240" cy="45" r="4.5" fill="#8f7cf7"/>
      <circle cx="110" cy="85" r="7" fill="#15161a" stroke="#e6e7eb" stroke-width="2.5"/>
    </svg>
    Every timeline branches from one moment, and replays exactly.<br>Choose a run, or start one.</div></main>
</div>

<div class="tip" id="tip"></div>
<dialog id="run-dialog">
  <form method="dialog" id="run-form">
    <h3 style="margin:0">New run</h3>
    <label>System
      <select name="kind"><option value="program">Test program</option><option value="compose">Compose file</option><option value="kubernetes">Kubernetes manifests</option></select>
    </label>
    <label>Path (on the server)<input name="path" required placeholder="zig-out/bin/bank-test, a compose.yaml or a manifests directory"></label>
    <label>Scenario<input name="scenario" placeholder="bank"></label>
    <label>Profile<input name="profile" placeholder="default"></label>
    <label data-tip="How long each timeline's drivers run, in virtual time (empty: 4 to 64 command starts)">Timeline length<input name="timeline" placeholder="e.g. 15m"></label>
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px">
      <label>Time budget<input name="time_budget" placeholder="e.g. 10m"></label>
      <label>Timelines (at most)<input name="branches" type="number" value="64" min="1"></label>
      <label>Seed<input name="seed" type="number" min="0" placeholder="fresh"></label>
      <label>Workers<input name="jobs" type="number" placeholder="all CPUs" min="1"></label>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
      <label data-tip="The guest's memory: for systems of several large nodes (empty: the server's)">Memory (MiB)<input name="memory_mib" type="number" min="256" placeholder="the server's"></label>
      <label data-tip="Every n-th timeline replayed from its tape as the run goes, judged by &quot;timelines replay to their recorded history&quot; (1: all, a determinism check)">Replay every n-th timeline<input name="verify_replays" type="number" min="1" placeholder="16"></label>
    </div>
    <label style="display:flex;gap:6px;align-items:center"><input type="checkbox" name="repeat" style="width:auto">
      Repeat: when it ends, another starts with a fresh seed (continuous testing)</label>
    <label style="display:flex;gap:6px;align-items:center"><input type="checkbox" name="priority" style="width:auto">
      Priority: its VMs take CPUs before other runs' (a check beside a hunt)</label>
    <label>Branching<select name="branching"><option value="tree">Tree: also from moments of earlier timelines that reached new behaviors</option>
      <option value="flat">Flat: every timeline from the setup snapshot</option></select></label>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
      <label data-tip="A targeted run: the tree returns first to timelines that ran these lines, and the run says which ran and which never did (needs line coverage: Python, the JVM, Go built with Antithesis's instrumentor)">Changed code (optional)<input name="changed" placeholder="a commit, a..b, v1.6.0..v1.7.0, or a diff file"></label>
      <label data-tip="Where the commit or range is: the system's repository, a URL (fetched by the server) or a directory on the server. Empty: the server's working directory">Repository<input name="changed_repository" placeholder="https://github.com/org/system"></label>
    </div>
    <label>Strategy (optional; it plans its own branches, so the branching is flat)<input name="strategy" placeholder="det-strategy-mutate --sync-dir /tmp/corpus   or   @my-strategy --flag"></label>
    <label>Or upload one (any executable or script with a #! line; it runs on the server)
      <input type="file" id="strategy-file"></label>
    <div class="muted" id="strategy-status" style="font-size:12px"></div>
    <div style="display:flex;gap:8px;justify-content:flex-end">
      <button value="cancel" formnovalidate>Cancel</button>
      <button class="primary" value="start">Start</button>
    </div>
  </form>
</dialog>

<script>
"use strict";
const state = {
  runs: [], runId: null, run: null, poll: null, tab: "all", filter: "", logs: null,
  causality: new Map(), // Property message -> its latest causality analysis (causalityRefresh).
  causalityLoaded: null, causalityTimer: null,
  view: "report", notebook: null, // The run's notebook: cells, their outputs, action results.
  open: new Set(["findings", "properties", "map", "output"]), // Sections shown expanded.
  discovery: null, // The last discovery chart drawn ({runId, html}): kept until the next one.
  refreshing: false, // A refresh in flight: polls do not pile up behind a slow one.
  examples: new Map(), // A property's examples once loaded (by message), and those shown open.
  examplesOpen: new Set(),
};
const $ = (selector, root = document) => root.querySelector(selector);
const escape = (text) => String(text).replace(/[&<>"']/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const seconds = (ns) => (ns / 1e9).toFixed(3) + "s";
const quote = (text) => '"' + String(text).replace(/\\/g, "\\\\").replace(/"/g, '\\"') + '"';

async function api(path, body) {
  const response = await fetch(path, body === undefined ? {} : {
    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body),
  });
  const text = await response.text();
  if (!response.ok) throw new Error(text);
  return text;
}
const apiJson = async (path, body) => JSON.parse(await api(path, body));
const lines = (text) => text.split("\n").filter((line) => line.trim()).map((line) => JSON.parse(line));
const query = async (request) => lines(await api(`/runs/${state.runId}/query`, request));

// Runs ------------------------------------------------------------------------------------
// A run, from its events database: its record and stats, its timelines, its properties.
// A run's timelines are kept (a long run's list is megabytes): each refresh asks only for those
// ingested since (in the order they finished), and for the whole list again only if the page
// has more than the run (another run under the same number).
const timelinesKept = new Map(); // Run id -> its timelines, by index.
// Everything a run's page shows, in one wave of requests side by side: each costs a round trip
// (120 ms from a laptop to a server across an ocean), and in turn they added up to seconds.
async function runFetch(id) {
  let kept = timelinesKept.get(id);
  // Not the failures: the tree's alone, fetched by it when timelines finished since (a long
  // running run's take seconds of its database each time it changes).
  const [info, properties, fetched, discovery] = await Promise.all([
    apiJson(`/runs/${id}`), apiJson(`/runs/${id}/properties`),
    apiJson(kept ? `/runs/${id}/timelines?offset=${kept.length}` : `/runs/${id}/timelines`),
    apiJson(`/runs/${id}/discovery`).catch(() => null)]);
  const failures = null;
  const total = info.stats && info.stats.timelines;
  if (!kept) kept = fetched;
  // Fewer than kept: the run's database was made again; all of them anew.
  else if (total != null && kept.length > total) kept = await apiJson(`/runs/${id}/timelines`);
  else if (fetched.length) kept = kept.concat(fetched).sort((a, b) => a.index - b.index);
  timelinesKept.set(id, kept);
  return { ...info, branches: kept, properties, discovery, failures };
}
// Runs forked from moments of others, kept once they ended: subtrees in the tree.
const details = new Map();
async function runDetails(run) {
  const known = details.get(run.id);
  if (known && known.state !== "running") return known;
  try { details.set(run.id, await runFetch(run.id)); } catch { /* Not yet. */ }
  return details.get(run.id);
}
function runLabel(run) {
  const fork = run.from_branch != null ? ` · fork of #${run.from_branch}` : "";
  return escape([run.system, run.scenario].filter(Boolean).join(" · ") + fork);
}
async function runsRefresh() {
  try { state.runs = await apiJson("/runs"); } catch { return; }
  const list = $("#runs");
  list.innerHTML = state.runs.slice().reverse().map((run) =>
    `<li data-id="${run.id}" class="${run.id === state.runId ? "selected" : ""}">
       <span class="label">Run ${run.id}<small>${runLabel(run)}</small></span>${stateBadge(run.state)}</li>`).join("");
  list.querySelectorAll("li").forEach((item) =>
    item.addEventListener("click", () => runOpen(Number(item.dataset.id))));
}
function stateBadge(name) {
  const kind = { passed: "pass", failed: "fail", running: "running", stopped: "stopped", interrupted: "stopped" }[name] || "error";
  return `<span class="badge ${kind}">${escape(name)}</span>`;
}

// A run's views, each its own page (#<id>/<view>), as Antithesis splits its results: the
// report (findings, environment, utilization, properties), the Logs Explorer (search, the
// multiverse tree, logs), the explorer's output, the notebook. Only the open one is drawn and
// kept up to date: one page holding all of them (the tree alone 100,000 SVG elements in a run of
// 2,500 timelines) was busy 70% of the time with its refreshes.
const views = [["report", "Report"], ["explorer", "Logs explorer"], ["output", "Output"], ["notebook", "Notebook"]];
function routeOf(hash) {
  const [id, view] = hash.replace(/^#/, "").split("/");
  return { id: Number(id), view: views.some(([name]) => name === view) ? view : "report" };
}
function routeSet() {
  const hash = `#${state.runId}${state.view === "report" ? "" : "/" + state.view}`;
  if (location.hash !== hash) history.replaceState(null, "", hash);
}

async function runOpen(id, view) {
  state.runId = id;
  if (view) state.view = view;
  routeSet();
  // Never the previous run's page under this run's name: a placeholder until it loads.
  if (!state.run || state.run.id !== id) {
    state.run = null;
    $("#main").innerHTML = `<div class="empty"><h2>Run ${id}</h2><div class="muted">Loading…</div></div>`;
  }
  state.examples = new Map();
  state.examplesOpen = new Set();
  state.logs = null;
  state.notebook = null;
  clearTimeout(state.poll);
  runsRefresh();
  await runRefresh();
  // While it runs: again 2 s after a refresh, or five times as long as the last took (serve
  // answers from the run's database, on the hunt's CPUs: 0.6 s a refresh at 3,000 timelines).
  const poll = async () => {
    if (state.runId !== id) return;
    const started = performance.now();
    if (state.run && state.run.state === "running") { await runRefresh(); runsRefresh(); }
    if (state.runId !== id) return;
    state.poll = setTimeout(poll, Math.max(2000, 5 * (performance.now() - started)));
  };
  state.poll = setTimeout(poll, 2000);
}

async function runRefresh() {
  if (state.refreshing) return;
  state.refreshing = true;
  const id = state.runId;
  let fresh;
  try { fresh = await runFetch(id); } finally { state.refreshing = false; }
  if (id !== state.runId) return; // Another run was opened meanwhile.
  const before = state.run;
  state.run = fresh;
  if (state.view === "notebook" && $("#notebook")) return; // Never under the writer's cursor.
  // While the run goes on, what changes is updated in place (no flicker, no re-query of every
  // section); the tree, which queries every timeline's events, every 10 seconds.
  const same = before && before.id === state.run.id && $("#run-times");
  if (same && before.state === "running" && state.run.state === "running") return liveUpdate();
  render();
}

function liveUpdate() {
  const times = $("#run-times");
  if (times) times.textContent = timesHtml();
  if ($("#stats-live")) $("#stats-live").outerHTML = statsHtml();
  if ($("#charts-live")) { $("#charts-live").outerHTML = chartsHtml(); discoveryDraw(); }
  outputDraw();
  const bar = $(".progress div");
  if (bar) bar.style.width = `${100 * progress()}%`;
  const properties = $("#properties");
  // Not under the reader: examples open (and a causality analysis in them) stay as they are.
  if (properties && state.examplesOpen.size) $(".summary", properties).innerHTML = propertiesSummary();
  else if (properties && document.activeElement !== $("#property-filter")) {
    $(".summary", properties).innerHTML = propertiesSummary();
    $(".body", properties).innerHTML = propertiesBody();
    propertiesWire();
  }
  const map = $("#map");
  if (map) $(".summary", map).textContent = `${state.run.branches.length} timelines from the setup snapshot`;
  // The tree again only when timelines finished since (and every 10 s at most).
  if (map && Date.now() - (state.treeDrawn || 0) > 10000 && state.treeTimelines !== state.run.branches.length) {
    state.treeDrawn = Date.now();
    state.treeTimelines = state.run.branches.length;
    mapDraw();
  }
}

// Rendering -------------------------------------------------------------------------------
// How far the run is: by its time budget, or by its timelines.

  // Not the timelines' wall times: they add up across the cores a run takes (all, without --jobs).
  const since = run.started_s || run.created_s;
  if (info.time_budget_s && since) return Math.min(1, Math.max(0, Date.now() / 1000 - since) / info.time_budget_s);

}
// When the run was asked for, last (re)started and ended (serve reads them from its files).

  if (run.started_s && run.started_s - run.created_s > 60) parts.push(`resumed ${clock(run.started_s)}`);

  const stat = (title, value, note, color = "") =>

  const planned = info.time_budget_s ? `budget ${duration(info.time_budget_s)}` : `of ${info.branches || "?"}`;

    ${stat("Properties", `${failed} / ${list.length}`, run.state === "running" ? "failing so far" : "failing", failed ? "var(--fail)" : "var(--pass)")}

function render() {

    ${sectionHtml("environment", "Environment", environmentSummary(), environmentBody(), isOpen("environment"))}
    ${sectionHtml("utilization", "Utilization", utilizationSummary(), utilizationBody(), isOpen("utilization"))}

function viewTabsWire() {

// A targeted run (--changed): which hunks ran, in how many timelines, and which never did.
function changedSummary(changed) {

}

    const count = changed.timelines[index];

    const badge = count > 0
      ? `<span class="badge pass">ran in ${count}/${total}</span>`
      : `<span class="badge fail">never ran</span>`;
    // When it first ran, or how near a timeline came (the line nearest it that ran).
    const first = changed.first?.[index];
    const closest = changed.closest?.[index];
    const note = count > 0 && first != null && first < 4294967295
      ? `first in #${first}`

    const noteHtml = note ? `<span class="muted" style="font-size:12px">${note}</span>` : "";
    return `<li style="display:flex;gap:10px;align-items:baseline">${badge}<code>${where}</code>${noteHtml}</li>`;
  }).join("");

// The explorer's own lines (its progress every half minute, its timelines, its verdicts), the
// last 300, kept at the bottom while the reader is there.
async function outputDraw() {
  const box = $("#output-body");
  if (!box || $("#output").classList.contains("closed")) return;
  const id = state.runId;
  let text;
  try { text = await api(`/runs/${id}/output?lines=300&explorer=1`); } catch { return; }
  if (id !== state.runId || !$("#output-body")) return;
  const atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 40;
  box.textContent = text.trim() || "Nothing yet: the system is being built and booted.";

}

function sectionHtml(id, title, summary, body, open) {

// Environment: what was tested (the resolved system recorded with the run).

function utilizationSummary() {
  const vtime = state.run.branches.reduce((sum, branch) => sum + branch.vtime_ns, 0);
  return `${(vtime / 1e9).toFixed(1)} virtual seconds explored`;
}

  const wall = run.summary ? run.summary.wall_ns : run.started_s ? Math.max(0, Date.now() / 1000 - run.started_s) * 1e9 : 0;
  const rows = [

  const id = state.runId;
  let points;
  try { points = (state.run && state.run.id === id && state.run.discovery || await apiJson(`/runs/${id}/discovery`)).points; } catch (error) {
    const box = $("#discovery");
    if (box && !discoveryKept()) box.textContent = `No events recorded (${error.message}).`;
    return;
  }
  const box = $("#discovery");
  if (!box || id !== state.runId) return;
  if (!points.length) { if (!discoveryKept()) box.textContent = "No timelines yet."; return; }
  const width = Math.max(320, box.clientWidth), height = 170, left = 44, bottom = 22;
  const maxX = Math.max(1, points[points.length - 1][0]), maxY = Math.max(1, ...points.map((p) => p[1]));
  const x = (v) => left + (width - left - 12) * v / maxX, y = (v) => height - bottom - (height - bottom - 10) * v / maxY;
  const line = points.map(([b, n], i) => `${i ? "L" : "M"}${x(b).toFixed(1)},${y(n).toFixed(1)}`).join(" ");
  const area = `${line} L${x(maxX).toFixed(1)},${y(0)} L${x(0)},${y(0)} Z`;
  const ticksX = [0, 0.25, 0.5, 0.75, 1].map((f) => Math.round(maxX * f)).map((v) =>
    `<text x="${x(v)}" y="${height - 4}" fill="#9a9eab" font-size="10" text-anchor="middle">${v}</text>`).join("");
  const ticksY = [0, 0.5, 1].map((f) => Math.round(maxY * f)).map((v) =>
    `<text x="${left - 8}" y="${y(v) + 4}" fill="#9a9eab" font-size="10" text-anchor="end">${v.toLocaleString()}</text>

  const recent = points.filter(([b]) => b >= maxX * 0.8);

}

function propertiesBody() {

  const tabs = ["all", "passed", "failed", "rare"].filter((tab) => tab !== "rare" || counts.rare).map((tab) =>

// A sometimes that passed in under 5% of 100 timelines or more (report.zig's rarely_true): when

function propertiesWire() {
  document.querySelectorAll("[data-tab]").forEach((button) => button.addEventListener("click", (event) => {
    event.stopPropagation(); state.tab = button.dataset.tab; render();
  }));
  const filter = $("#property-filter");

    state.filter = filter.value;

    render();

    examplesToggle(row.parentElement)));

  document.querySelectorAll(".property").forEach((element) => {
    if (!state.examplesOpen.has(element.dataset.message)) return;
    $(".examples", element).hidden = false;
    examplesDraw(element);
  });
}

// Examples: the moments a property failed (and passed), by timeline.
async function examplesToggle(element) {
  const message = element.dataset.message;
  const box = $(".examples", element);
  box.hidden = !box.hidden;
  if (box.hidden) { state.examplesOpen.delete(message); return; }
  state.examplesOpen.add(message);
  if (state.causalityLoaded !== state.runId) { state.causalityLoaded = state.runId; causalityRefresh(); }
  if (state.examples.has(message)) return examplesDraw(element);
  box.innerHTML = `<div class="muted">Loading examples…</div>`;
  const conditions = exampleConditions(message, element.dataset.kind);
  try {
    const failing = conditions.failing ? await query({ condition: conditions.failing, output: "branches", limit: 1000000 }) : [];
    const passing = conditions.passing ? await query({ condition: conditions.passing, output: "branches", limit: 1000000 }) : [];
    state.examples.set(message, { failing, passing, note: conditions.note });
  } catch (error) { state.examples.set(message, { error: error.message }); }
  // Drawn where the property is now (the list may have been drawn again meanwhile).
  const now = [...document.querySelectorAll(".property")].find((other) => other.dataset.message === message);
  if (now && state.examplesOpen.has(message)) examplesDraw(now);
}
// What makes one timeline fail a property, or pass it, by its kind. Only evaluations count:

function exampleConditions(message, kind) {
  const ours = (condition) => `assert.message=${quote(message)} assert.condition=${condition}`;
  const theirs = (condition) => `antithesis_assert.message=${quote(message)} antithesis_assert.hit=true` +
    (condition == null ? "" : ` antithesis_assert.condition=${condition}`);

    case "always": case "always_or_unreachable":
      return { failing: `${ours(false)} or ${theirs(false)}`, passing: `${ours(true)} or ${theirs(true)}` };
    case "unreachable": // Reaching it is the failure.
      return { failing: `${ours(true)} or ${theirs(null)}`, passing: null };

function examplesDraw(element) {
  const message = element.dataset.message;

  if (!loaded) { box.innerHTML = `<div class="muted">Loading examples…</div>`; return; }
  if (loaded.error) { box.innerHTML = `<div class="fail-text">${escape(loaded.error)}</div>`; return; }
  const { failing, passing } = loaded;
  const failingBranches = new Set(failing.map((example) => example.branch));
  const rows = [
    ...failing.slice(0, 10).map((example) => ({ ...example, failing: true })),
    ...passing.filter((example) => !failingBranches.has(example.branch)).slice(0, 5).map((example) => ({ ...example, failing: false })),
  ];
  box.innerHTML = rows.length ? `<table><tr><th>Example</th><th>Branch</th><th>Time</th><th>Hits</th><th></th></tr>
    ${rows.map((row) => `<tr class="clickable" data-branch="${row.branch}" data-vtime="${row.first_vtime_ns}">
      <td class="${row.failing ? "fail-text" : "pass-text"}">${row.failing ? "Failing" : "Passing"}</td>
      <td class="mono">${row.branch}</td><td class="mono">${seconds(row.first_vtime_ns)}</td><td class="mono">${row.matches}</td>
      <td>${row.failing ? `<button class="causality" data-branch="${row.branch}" title="How likely the failure was at each moment of this timeline">Causality</button>` : ""}</td></tr>`).join("")}
    </table><div class="muted" style="margin-top:4px">${failing.length} failing timelines, ${passing.filter((example) => !failingBranches.has(example.branch)).length} passing. Click an example for its logs.${loaded.note ? ` ${escape(loaded.note)}` : ""}</div>
    ${failing.length ? causalityOptionsHtml() : ""}
    <div class="causality-result"></div>`
    : `<div class="muted">No assertion events for this property (determinismo checks it when a timeline ends).</div>`;
  box.querySelectorAll("tr.clickable").forEach((row) => row.addEventListener("click", () =>
    logsOpen(Number(row.dataset.branch), Number(row.dataset.vtime))));

    event.stopPropagation();
    causalityRun(message, Number(button.dataset.branch));
  }));
  box.querySelectorAll(".causality-options [data-option]").forEach((input) => input.addEventListener("change", () => {
    causalityOptions[input.dataset.option] = input.value;
    try { localStorage.setItem("causalityOptions", JSON.stringify(causalityOptions)); } catch { /* Kept for this page only. */ }
  }));
  causalityDraw(message);
}

// Findings: what changed since the previous run of the same system and scenario.
async function findingsLoad() {
  const body = $("#findings-body");
  if (!body || state.run.state === "running") return;
  let result;
  try { result = await apiJson(`/runs/${state.runId}/findings`); }
  catch { body.textContent = "No summary for this run."; return; }
  const counts = {};
  for (const finding of result.findings) counts[finding.finding] = (counts[finding.finding] || 0) + 1;
  const summary = $("#findings .summary");
  if (summary) summary.innerHTML = ["new", "ongoing", "resolved", "unseen"].filter((kind) => counts[kind])
    .map((kind) => `<span class="${kind === "resolved" ? "pass-text" : kind === "new" ? "fail-text" : ""}">${counts[kind]} ${kind}</span>`).join(", ")
    || (result.previous == null ? "first run of this system" : "nothing changed");
  const badge = { new: "fail", ongoing: "error", resolved: "pass", unseen: "error" };
  body.innerHTML = result.findings.length ? result.findings.map((finding) =>
    `<div class="property" style="cursor:pointer" data-goto="${escape(finding.message)}"><div class="row">
      <span class="badge ${badge[finding.finding]}">${finding.finding.toUpperCase()}</span>

      <span class="name">${escape(finding.message)}</span><span class="counts">${escape(finding.kind)}</span></div></div>`).join("")
    + `<div class="muted" style="margin-top:6px">${result.previous == null ? "No earlier run of this system and scenario: every failure is new." : `Compared with run ${result.previous}.`}</div>`
    : `<div class="muted">${result.previous == null ? "First run of this system and scenario, and nothing failed." : `Nothing changed since run ${result.previous}.`}</div>`;
  body.querySelectorAll("[data-goto]").forEach((element) => element.addEventListener("click", () => {
    const property = document.querySelector(`.property[data-message="${CSS.escape(element.dataset.goto)}"]`);
    if (!property) return;

// Causality analysis (causality.zig): the failure's probability at moments of the timeline,
// from futures forked there (from snapshots of it saved to disk). A jump marks where the timeline
// made the bug likely: the faults injected in that window are named on it. Analyses are the
// run's (GET /runs/<id>/causality): a property shows its latest one, running or done.
async function causalityRefresh() {
  const run = state.runId;
  let analyses;
  try { analyses = await apiJson(`/runs/${run}/causality`); } catch { return; }
  if (state.runId !== run) return;
  for (const analysis of analyses) {
    const property = analysis.of && analysis.of.property;
    if (!property) continue;
    const known = state.causality.get(property);
    if (known && known.run === run && known.id > analysis.id) continue;
    const faults = known && known.run === run && known.id === analysis.id ? known.faults : null;
    state.causality.set(property, { ...analysis, run, branch: analysis.of.branch, faults });
  }
  for (const property of state.causality.keys()) causalityDraw(property);
  clearTimeout(state.causalityTimer);
  if (analyses.some((analysis) => !analysis.done)) state.causalityTimer = setTimeout(causalityRefresh, 3000);
}
// The analysis's parameters (causality.zig), kept per browser: the planner (built in, a plugin's

  const field = (name, label, width, tip, attributes = "") => `<label data-tip="${escape(tip)}">${label}
    <input data-option="${name}" value="${escape(String(causalityOptions[name]))}" style="width:${width}" ${attributes}></label>`;
  return `<div class="causality-options muted">Causality:
    ${field("planner", "planner", "190px", "Which moments to analyze: empty for the built-in one (evenly, then halfway inside each jump); a plugin: tcp://127.0.0.1:9102 (the Clojure host's planners: faults, bisect, dense), @name (uploaded), or a command", 'placeholder="built-in"')}
    ${field("verdict", "verdict", "200px", "What counts as the bug in a future: empty for this property failing, or any event condition (as in Search), e.g. event=fault details.kind=partition", 'placeholder="the property failing"')}
    ${field("points", "moments", "40px", "Moments in the first round, evenly to the failure (and one just after the setup snapshot)", 'type="number" min="1" max="64"')}
    ${field("futures", "futures", "40px", "Futures forked from each moment: more, a narrower interval", 'type="number" min="1" max="256"')}
    ${field("refine", "rounds", "36px", "Rounds after the first, at most: the planner narrows the jumps", 'type="number" min="0" max="20"')}
    ${field("jump_min", "jump", "44px", "A change in probability this large between two moments is narrowed down", 'type="number" min="0.01" max="1" step="0.05"')}</div>`;
}
async function causalityRun(property, branch) {
  const run = state.runId;
  state.causality.set(property, { run, id: Infinity, branch, of: { branch, property }, points: [], done: false, starting: true });
  causalityDraw(property);
  const options = causalityOptions;
  const body = { branch, property, points: Number(options.points), futures: Number(options.futures),
    refine: Number(options.refine), jump_min: Number(options.jump_min) };
  if (String(options.planner).trim()) body.planner = String(options.planner).trim();
  if (String(options.verdict || "").trim()) body.verdict = String(options.verdict).trim();
  try {
    await apiJson(`/runs/${run}/causality`, body);
  } catch (error) {
    state.causality.set(property, { run, id: Infinity, branch, points: [], done: true, error: error.message });
    causalityDraw(property);

// The faults the timeline went through up to the failure (its ancestors' included): what the

async function causalityFaults(property, analysis) {
  if (analysis.faults || analysis.faultsLoading || !analysis.of || analysis.of.failure_ms == null) return;
  analysis.faultsLoading = true;
  try {
    analysis.faults = await query({ condition: "event=fault", branch: analysis.branch,
      up_to_vtime: analysis.of.failure_ms / 1000 + 1, limit: 5000 });
  } catch { analysis.faults = []; }

}
function causalityDraw(property) {
  const analysis = state.causality.get(property);
  if (!analysis || analysis.run !== state.runId) return;
  const element = [...document.querySelectorAll(".property")].find((other) => other.dataset.message === property);
  const box = element && $(".causality-result", element);
  if (!box) return;
  if (analysis.error) { box.innerHTML = `<div class="fail-text">${escape(analysis.error)}</div>`; return; }
  if (analysis.points.length) causalityFaults(property, analysis);
  box.innerHTML = causalityChart(analysis);
  box.querySelectorAll("[data-vtime]").forEach((target) => target.addEventListener("click", () =>
    logsOpen(analysis.branch, Number(target.dataset.vtime))));
  const curlLink = box.querySelector(".causality-curl");
  if (curlLink) curlLink.addEventListener("click", async (event) => {
    event.preventDefault();
    event.stopPropagation();
    const text = causalityCurl(analysis);
    try { await clipboardWrite(text); curlLink.textContent = "copied"; }
    catch { curlLink.textContent = "copy failed"; curlLink.title = text; }
    setTimeout(() => { curlLink.textContent = "copy as curl"; }, 1500);
  });
  // Zoom: drag across the chart for a range, a jump's "zoom" for its window, double click or
  // "whole timeline" back.
  const zoom = (view) => { analysis.view = view; causalityDraw(property); };
  box.querySelectorAll("[data-zoom-from]").forEach((link) => link.addEventListener("click", (event) => {
    event.stopPropagation();
    const from = Number(link.dataset.zoomFrom), to = Number(link.dataset.zoomTo), pad = Math.max((to - from) * 0.5, 5);
    zoom({ x0: from - pad, x1: to + pad });
  }));
  const whole = box.querySelector("[data-zoom-reset]");
  if (whole) whole.addEventListener("click", () => zoom(null));
  const svg = box.querySelector("svg.causality-chart");
  if (!svg) return;
  const at = (event) => {
    const rect = svg.getBoundingClientRect(), d = svg.dataset;
    const x = (event.clientX - rect.left) / rect.width * Number(d.width);
    return Number(d.x0) + (x - Number(d.left)) / (Number(d.right) - Number(d.left)) * (Number(d.x1) - Number(d.x0));
  };
  let from = null;
  svg.addEventListener("mousedown", (event) => { if (event.button === 0) from = { ms: at(event), x: event.clientX }; });
  svg.addEventListener("mouseup", (event) => {
    if (!from) return;
    const moved = Math.abs(event.clientX - from.x) > 6, to = at(event);
    if (moved) zoom({ x0: Math.min(from.ms, to), x1: Math.max(from.ms, to) });

// Neighbors whose probabilities differ by a fifth or more (causality.zig refines those).

  return `${kind || "fault"}${d.pod ? " " + d.pod + (d.peer_pod ? "↔" + d.peer_pod : "") : d.node ? " " + d.node + (d.peer ? "↔" + d.peer : "") : ""}`;

// Text to the clipboard: the Clipboard API where the page is a secure context, else a selected

  if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(text);
  const area = document.createElement("textarea");
  area.value = text;
  area.style.position = "fixed";
  area.style.opacity = "0";
  document.body.appendChild(area);
  area.select();
  const copied = document.execCommand("copy");
  area.remove();

// The analysis's request as a shell command: its branch, property, futures, planner and verdict,

function causalityCurl(analysis) {
  const of = analysis.of || {};
  const body = { branch: of.branch, property: of.property, futures: of.futures,
    points: Number(causalityOptions.points), refine: Number(causalityOptions.refine),
    jump_min: Number(causalityOptions.jump_min) };
  if (of.planner && of.planner !== "built-in") body.planner = of.planner;
  if (of.verdict) body.verdict = of.verdict;
  const json = JSON.stringify(body).replace(/'/g, "'\\''");

function causalityChart(analysis) {
  const of = analysis.of || {};
  const planner = of.planner && of.planner !== "built-in" ? ` · planner ${escape(of.planner)}` : "";
  const number = Number.isFinite(analysis.id) ? ` · analysis ${analysis.id}` : "";
  const automatic = analysis.automatic ? " · started on its first failure" : "";
  const curl = of.property ? ` · <a href="#" class="causality-curl" data-tip="Copy the HTTP request that starts this analysis again (curl)">copy as curl</a>` : "";
  const title = `<div class="group-title">Bug probability · branch ${analysis.branch}${planner}${number}${automatic}${analysis.done ? "" : " (running)"}${curl}</div>`;
  const points = [...analysis.points].sort((x, y) => x.vtime_ms - y.vtime_ms);
  if (!points.length) return title + `<div class="muted">${analysis.done ? "The property did not fail again in this timeline's replay."
    : "Saving the timeline's moments to disk, then forking futures from each…"}</div>`;
  const W = 900, H = 300, L = 46, R = 18, T = 18, B = 40;
  const x0 = analysis.view ? analysis.view.x0 : of.snapshot_ms != null ? of.snapshot_ms : points[0].vtime_ms;
  const x1 = analysis.view ? Math.max(analysis.view.x1, x0 + 1)
    : Math.max(of.failure_ms != null ? of.failure_ms : points[points.length - 1].vtime_ms, x0 + 1);
  const xs = (ms) => L + (ms - x0) / (x1 - x0) * (W - L - R);
  const ys = (p) => T + (1 - p) * (H - T - B);
  const muted = "#9a9eab", grid = "rgba(154,158,171,0.18)";
  let svg = "";
  for (const p of [0, 0.25, 0.5, 0.75, 1]) {
    svg += `<line x1="${L}" x2="${W - R}" y1="${ys(p)}" y2="${ys(p)}" stroke="${grid}"/>
      <text x="${L - 6}" y="${ys(p) + 3}" fill="${muted}" font-size="10" text-anchor="end">${p * 100}%</text>`;
  }
  const span_s = (x1 - x0) / 1000;
  const step = [0.001, 0.002, 0.005, 0.01, 0.02, 0.05, 0.1, 0.2, 0.5, 1, 2, 5, 10, 20, 30, 60, 120, 300]
    .find((candidate) => span_s / candidate <= 12) || 600;

  for (let i = Math.ceil(x0 / 1000 / step); i * step * 1000 <= x1; i++) {

  }
  svg += `<text x="${(L + W - R) / 2}" y="${H - 6}" fill="${muted}" font-size="10" text-anchor="middle">virtual time of branch ${analysis.branch}</text>`;
  // Jumps: the window, a line where it ends, the faults injected in it.
  const jumps = causalityJumps(points);
  const faults = analysis.faults || [];
  const named = jumps.map((jump) => ({ ...jump, faults: faults.filter((event) =>
    event.vtime_ns > jump.a.vtime_ms * 1e6 && event.vtime_ns <= jump.b.vtime_ms * 1e6) }));
  named.forEach((jump, i) => {
    const xa = xs(jump.a.vtime_ms), xb = xs(jump.b.vtime_ms);
    const label = jump.faults.length ? jump.faults.slice(0, 2).map(faultName).join(", ") + (jump.faults.length > 2 ? ` +${jump.faults.length - 2}` : "")
      : analysis.faults ? "no fault: the program's own course" : "";
    const tip = `<div class="t-title">${seconds(jump.a.vtime_ms * 1e6)} → ${seconds(jump.b.vtime_ms * 1e6)}: ${(jump.a.probability * 100).toFixed(0)}% → ${(jump.b.probability * 100).toFixed(0)}%</div>
      ${jump.faults.length ? jump.faults.map((event) => `${seconds(event.vtime_ns)} ${escape(faultName(event))}`).join("<br>") : "No fault injected in this window."}
      <div class="t-foot">Click for the logs up to ${seconds(jump.b.vtime_ms * 1e6)}</div>`;
    svg += `<g data-clip data-vtime="${jump.b.vtime_ms * 1e6}" style="cursor:pointer" ${tipAttr(tip)}>
