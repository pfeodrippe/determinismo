<!doctype html>
<!-- SPDX-License-Identifier: MIT -->
<!-- determinismo's web UI, served by `determinismo serve` at /. One page, no build step, no
     dependencies: it reads the HTTP API (src/serve.zig) and updates live while runs go. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>determinismo</title>
<style>
:root {
  --bg: #15161a; --panel: #1d1f25; --panel-2: #24262e; --line: #30333d; --text: #e6e7eb;
  --muted: #9a9eab; --accent: #8f7cf7; --pass: #3fbf7f; --fail: #f0506e; --warn: #f0a650;
  --info: #5aa9f0; --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, sans-serif; }
a { color: var(--accent); cursor: pointer; text-decoration: none; }
button, input, select, textarea {
  font: inherit; color: var(--text); background: var(--panel-2); border: 1px solid var(--line);
  border-radius: 6px; padding: 6px 10px;
}
button { cursor: pointer; }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
input:focus, select:focus, textarea:focus { outline: 1px solid var(--accent); }
.layout { display: grid; grid-template-columns: 260px 1fr; min-height: 100vh; }
aside { background: var(--panel); border-right: 1px solid var(--line); padding: 16px; }
main { padding: 20px 28px; min-width: 0; }
h1 { font-size: 18px; margin: 0 0 14px; letter-spacing: .3px; }
h1 span { color: var(--accent); }
h2 { font-size: 20px; margin: 0; }
.runs { list-style: none; padding: 0; margin: 12px 0 0; }
.runs li { padding: 8px 10px; border-radius: 6px; cursor: pointer; display: flex; justify-content: space-between; }
.runs li:hover, .runs li.selected { background: var(--panel-2); }
.badge { font-size: 11px; padding: 2px 8px; border-radius: 10px; border: 1px solid; white-space: nowrap; }
.badge.pass { color: var(--pass); border-color: var(--pass); }
.badge.fail { color: var(--fail); border-color: var(--fail); }
.badge.running { color: var(--info); border-color: var(--info); }
.badge.error { color: var(--warn); border-color: var(--warn); }
.badge.stopped { color: var(--muted); border-color: var(--muted); }
section { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; margin: 14px 0; }
section > header { display: flex; align-items: baseline; gap: 12px; padding: 12px 16px; cursor: pointer; }
section > header h3 { margin: 0; font-size: 17px; color: #c9cbd3; }
section > header .summary { color: var(--muted); font-size: 13px; }
section > .body { padding: 4px 16px 16px; }
section.closed > .body { display: none; }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 4px 16px; font-size: 13px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; font-family: var(--mono); word-break: break-all; }
.progress { height: 6px; background: var(--panel-2); border-radius: 3px; overflow: hidden; margin-top: 10px; }
.progress div { height: 100%; background: var(--accent); transition: width .4s; }
.tabs { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.tabs button { border: 0; border-radius: 0; background: transparent; padding: 4px 12px; }
.tabs button.on { background: var(--panel-2); }
.group-title { margin: 14px 0 4px; color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .6px; }
.property { border-top: 1px solid var(--line); }
.property > .row { display: flex; align-items: center; gap: 10px; padding: 7px 4px; cursor: pointer; }
.property > .row .name { flex: 1; }
.property > .row .counts { color: var(--muted); font-size: 12px; font-family: var(--mono); }
.examples { margin: 0 0 10px 28px; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th { text-align: left; color: var(--muted); font-weight: 500; padding: 4px 8px; border-bottom: 1px solid var(--line); }
td { padding: 4px 8px; border-bottom: 1px solid #262830; vertical-align: top; }
tr.clickable { cursor: pointer; }
tr.clickable:hover { background: var(--panel-2); }
.mono { font-family: var(--mono); font-size: 12.5px; }
.fail-text { color: var(--fail); }
.pass-text { color: var(--pass); }
.muted { color: var(--muted); }
.search-form { display: grid; grid-template-columns: 1fr; gap: 8px; }
.search-form .temporal { display: grid; grid-template-columns: 180px 1fr 110px; gap: 8px; }
.search-form .actions { display: flex; gap: 8px; align-items: center; }
.logs { max-height: 560px; overflow: auto; border: 1px solid var(--line); border-radius: 6px; }
.logs table td { font-family: var(--mono); font-size: 12px; white-space: pre-wrap; word-break: break-word; }
.logs table td:first-child, .logs table td:nth-child(2) { white-space: nowrap; }
.logs tr.here { background: #3a2a44; }
.kind { font-size: 11px; padding: 1px 6px; border-radius: 4px; background: var(--panel-2); color: var(--muted); }
.kind.fault { color: var(--warn); }
.kind.assert-fail { color: var(--fail); }
.kind.assert { color: var(--pass); }
.kind.output { color: var(--info); }
.kind.command { color: var(--accent); }
.map { width: 100%; overflow-x: auto; }
.map svg { display: block; }
.legend { display: flex; gap: 16px; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: middle; }
dialog { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 10px; width: 520px; }
dialog::backdrop { background: rgba(0,0,0,.55); }
dialog form { display: grid; gap: 10px; }
dialog label { display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
pre.output { background: #101114; border: 1px solid var(--line); border-radius: 6px; padding: 10px; max-height: 360px; overflow: auto; white-space: pre-wrap; font-size: 12px; }
.empty { color: var(--muted); padding: 30px; text-align: center; }
.view-tabs { margin: 14px 0 0; }
.cell { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; margin: 10px 0; }
.cell textarea { width: 100%; border: 0; border-radius: 8px 8px 0 0; background: #101114; font-family: var(--mono);
  font-size: 12.5px; resize: vertical; min-height: 44px; padding: 10px; }
.cell .out { padding: 8px 12px; font-size: 13px; }
.cell .out:empty { display: none; }
.cell .out pre { margin: 4px 0; white-space: pre-wrap; font-family: var(--mono); font-size: 12px; }
.cell .out .error { color: var(--fail); white-space: pre-wrap; font-family: var(--mono); font-size: 12px; }
.cell .tools { display: flex; gap: 6px; justify-content: flex-end; padding: 0 8px 8px; }
.cell .tools button { padding: 2px 8px; font-size: 12px; }
.notebook-bar { display: flex; gap: 8px; align-items: center; margin-top: 12px; }
.action { display: flex; align-items: center; gap: 10px; margin: 6px 0; }
.md h1, .md h2, .md h3 { margin: 6px 0; }
.md code { font-family: var(--mono); background: var(--panel-2); padding: 0 4px; border-radius: 4px; }
.brand { display: flex; align-items: center; gap: 10px; margin: 0 0 16px; font-size: 18px; font-weight: 600; }
.runs li .label { display: grid; }
.runs li .label small { color: var(--muted); font-size: 12px; }
.stats { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; margin-top: 16px; }
.stat { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 16px; }
.stat .title { color: var(--muted); font-size: 11.5px; text-transform: uppercase; letter-spacing: .6px; }
.stat .value { font-size: 28px; font-weight: 600; margin: 2px 0; font-variant-numeric: tabular-nums; }
.stat .note { color: var(--muted); font-size: 12px; }
.charts { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px; }
.chart { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 16px; min-width: 0; }
.chart .head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; }
.chart .head h3 { margin: 0; font-size: 15px; color: #c9cbd3; }
.chart .head span { color: var(--muted); font-size: 12px; }
.bars .bar { display: grid; grid-template-columns: minmax(0, 1fr) 40% 44px; gap: 10px; align-items: center; padding: 4px 0; font-size: 12.5px; cursor: pointer; }
.bars .bar .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bars .bar .track { height: 10px; border-radius: 5px; background: var(--panel-2); overflow: hidden; }
.bars .bar .fill { height: 100%; border-radius: 5px; background: var(--fail); }
.bars .bar .count { text-align: right; font-variant-numeric: tabular-nums; }
.tree svg .timeline:hover path, .tree svg .timeline:hover line { stroke-opacity: 1; stroke-width: 2.2; }
.empty svg { display: block; margin: 40px auto 18px; }
.tip { position: fixed; z-index: 50; pointer-events: none; max-width: 420px; background: #23252d; color: var(--text);
  border: 1px solid #3a3d48; border-radius: 10px; padding: 10px 12px; font-size: 12.5px; line-height: 1.45;
  box-shadow: 0 10px 30px rgba(0,0,0,.45); opacity: 0; transform: translateY(4px); transition: opacity .08s, transform .08s; }
.tip.on { opacity: 1; transform: none; }
.tip .t-title { font-weight: 600; font-size: 13px; display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
.tip .t-dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
.tip .t-path { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; margin: 4px 0; font-family: var(--mono); font-size: 11.5px; }
.tip .t-chip { background: var(--panel-2); border: 1px solid var(--line); border-radius: 5px; padding: 0 5px; }
.tip .t-kv { display: grid; grid-template-columns: max-content 1fr; gap: 1px 10px; margin: 4px 0; }
.tip .t-kv dt { color: var(--muted); } .tip .t-kv dd { margin: 0; font-family: var(--mono); font-size: 11.5px; word-break: break-word; }
.tip .t-why { margin-top: 6px; padding: 6px 8px; border-left: 2px solid var(--accent); background: rgba(143,124,247,.08); border-radius: 0 6px 6px 0; }
.tip .t-why b { color: var(--accent); font-weight: 600; }
.tip .t-foot { margin-top: 6px; color: var(--muted); font-size: 11px; }
.tip .t-fail { color: var(--fail); }
@media (max-width: 1100px) { .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } .charts { grid-template-columns: 1fr; } }
</style>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='7' cy='16' r='5' fill='%238f7cf7'/%3E%3Cpath d='M11 16C18 16 18 6 26 6M11 16H26M11 16C18 16 18 26 26 26' stroke='%238f7cf7' stroke-width='3' fill='none'/%3E%3Ccircle cx='27' cy='6' r='3.5' fill='%233fbf7f'/%3E%3Ccircle cx='27' cy='16' r='3.5' fill='%233fbf7f'/%3E%3Ccircle cx='27' cy='26' r='3.5' fill='%23f0506e'/%3E%3C/svg%3E">
</head>
<body>
<div class="layout">
  <aside>
    <div class="brand"><svg width="40" height="30" viewBox="0 0 40 30" aria-hidden="true">
      <circle cx="8" cy="15" r="5" fill="#8f7cf7"/>
      <path d="M13 15 C 22 15, 22 5, 32 5 M13 15 L32 15 M13 15 C 22 15, 22 25, 32 25" stroke="#8f7cf7" stroke-width="2.4" fill="none"/>
      <circle cx="33" cy="5" r="3" fill="#3fbf7f"/><circle cx="33" cy="15" r="3" fill="#3fbf7f"/><circle cx="33" cy="25" r="3" fill="#f0506e"/></svg>determinismo</div>
    <button class="primary" id="new-run" style="width:100%">New run</button>
    <ul class="runs" id="runs"></ul>
  </aside>
  <main id="main"><div class="empty">
    <svg width="360" height="170" viewBox="0 0 360 170" aria-hidden="true">
      <line x1="10" y1="85" x2="110" y2="85" stroke="#9a9eab" stroke-width="3"/>
      <g fill="none" stroke-width="2" stroke-opacity=".75">
        <path d="M110 85 C150 85 150 15 190 15 L340 15" stroke="#3fbf7f"/>
        <path d="M110 85 C150 85 150 45 190 45 L320 45" stroke="#3fbf7f"/>
        <path d="M110 85 L330 85" stroke="#f0506e"/>
        <path d="M110 85 C150 85 150 125 190 125 L345 125" stroke="#3fbf7f"/>
        <path d="M110 85 C150 85 150 155 190 155 L310 155" stroke="#3fbf7f"/>
        <path d="M240 45 C260 45 260 32 280 32 L330 32 M240 45 C260 45 260 58 280 58 L325 58" stroke="#8f7cf7"/>
      </g>
      <rect x="230" y="11" width="3" height="8" fill="#f0a650"/><rect x="270" y="121" width="3" height="8" fill="#f0a650"/>
      <rect x="205" y="81" width="3" height="8" fill="#f0a650"/><circle cx="262" cy="85" r="4.5" fill="#f0506e"/>
      <circle cx="240" cy="45" r="4.5" fill="#8f7cf7"/>
      <circle cx="110" cy="85" r="7" fill="#15161a" stroke="#e6e7eb" stroke-width="2.5"/>
    </svg>
    Every timeline branches from one moment, and replays exactly.<br>Choose a run, or start one.</div></main>
</div>

<div class="tip" id="tip"></div>
<dialog id="run-dialog">
  <form method="dialog" id="run-form">
    <h3 style="margin:0">New run</h3>
    <label>System
      <select name="kind"><option value="program">Test program</option><option value="compose">Compose file</option></select>
    </label>
    <label>Path (on the server)<input name="path" required placeholder="zig-out/bin/bank-test or a compose.yaml"></label>
    <label>Scenario<input name="scenario" placeholder="bank"></label>
    <label>Profile<input name="profile" placeholder="default"></label>
    <label data-tip="How long each timeline's drivers run, in virtual time (empty: 4 to 64 command starts)">Timeline length<input name="timeline" placeholder="e.g. 15m"></label>
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px">
      <label>Time budget<input name="time_budget" placeholder="e.g. 10m"></label>
      <label>Timelines (at most)<input name="branches" type="number" value="64" min="1"></label>
      <label>Seed<input name="seed" type="number" value="0" min="0"></label>
      <label>Workers<input name="jobs" type="number" placeholder="all CPUs" min="1"></label>
    </div>
    <label>Branching<select name="branching"><option value="tree">Tree: also from moments of earlier timelines that reached new behaviors</option>
      <option value="flat">Flat: every timeline from the setup snapshot</option></select></label>
    <label>Strategy (optional; it plans its own branches, so the branching is flat)<input name="strategy" placeholder="det-strategy-mutate --sync-dir /tmp/corpus   or   @my-strategy --flag"></label>
    <label>Or upload one (any executable or script with a #! line; it runs on the server)
      <input type="file" id="strategy-file"></label>
    <div class="muted" id="strategy-status" style="font-size:12px"></div>
    <div style="display:flex;gap:8px;justify-content:flex-end">
      <button value="cancel" formnovalidate>Cancel</button>
      <button class="primary" value="start">Start</button>
    </div>
  </form>
</dialog>

<script>
"use strict";
const state = {
  runs: [], runId: null, run: null, poll: null, tab: "all", filter: "", logs: null,
  view: "report", notebook: null, // The run's notebook: cells, their outputs, action results.
  open: new Set(["findings", "properties", "map"]), // Sections shown expanded.
};
const $ = (selector, root = document) => root.querySelector(selector);
const escape = (text) => String(text).replace(/[&<>"']/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const seconds = (ns) => (ns / 1e9).toFixed(3) + "s";
const quote = (text) => '"' + String(text).replace(/\\/g, "\\\\").replace(/"/g, '\\"') + '"';

async function api(path, body) {
  const response = await fetch(path, body === undefined ? {} : {
    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body),
  });
  const text = await response.text();
  if (!response.ok) throw new Error(text);
  return text;
}
const apiJson = async (path, body) => JSON.parse(await api(path, body));
const lines = (text) => text.split("\n").filter((line) => line.trim()).map((line) => JSON.parse(line));
const query = async (request) => lines(await api(`/runs/${state.runId}/query`, request));

// Runs ------------------------------------------------------------------------------------
// Each run's record, kept once it finished: its label here, its subtrees in the tree.
const details = new Map();
async function runDetails(run) {
  const known = details.get(run.id);
  if (known && known.state !== "running") return known;
  try { details.set(run.id, await apiJson(`/runs/${run.id}`)); } catch { /* Not yet. */ }
  return details.get(run.id);
}
function runLabel(record) {
  const info = (record && record.run) || {};
  const system = (info.program || info.compose || "").split("/").pop();
  const fork = info.from_branch != null ? ` · fork of #${info.from_branch}` : "";
  return escape([system, info.scenario].filter(Boolean).join(" · ") + fork);
}
async function runsRefresh() {
  try { state.runs = await apiJson("/runs"); } catch { return; }
  await Promise.all(state.runs.map(runDetails));
  const list = $("#runs");
  list.innerHTML = state.runs.slice().reverse().map((run) =>
    `<li data-id="${run.id}" class="${run.id === state.runId ? "selected" : ""}">
       <span class="label">Run ${run.id}<small>${runLabel(details.get(run.id))}</small></span>${stateBadge(run.state)}</li>`).join("");
  list.querySelectorAll("li").forEach((item) =>
    item.addEventListener("click", () => runOpen(Number(item.dataset.id))));
}
function stateBadge(name) {
  const kind = { passed: "pass", failed: "fail", running: "running", stopped: "stopped" }[name] || "error";
  return `<span class="badge ${kind}">${escape(name)}</span>`;
}

async function runOpen(id) {
  state.runId = id;
  state.logs = null;
  state.notebook = null;
  clearInterval(state.poll);
  await runRefresh();
  runsRefresh();
  state.poll = setInterval(async () => {
    if (state.run && state.run.state === "running") { await runRefresh(); runsRefresh(); }
  }, 2000);
}

async function runRefresh() {
  const before = state.run;
  state.run = await apiJson(`/runs/${state.runId}`);
  if (state.view === "notebook" && $("#notebook")) return; // Never under the writer's cursor.
  // While the run goes on, what changes is updated in place (no flicker, no re-query of every
  // section); the tree, which queries every timeline's events, every 10 seconds.
  const same = before && before.id === state.run.id && $("#stats-live");
  if (same && before.state === "running" && state.run.state === "running") return liveUpdate();
  render();
}

function liveUpdate() {
  $("#stats-live").outerHTML = statsHtml();
  $("#charts-live").outerHTML = chartsHtml();
  discoveryDraw();
  const bar = $(".progress div");
  if (bar) bar.style.width = `${100 * progress()}%`;
  const properties = $("#properties");
  if (properties && document.activeElement !== $("#property-filter")) {
    $(".summary", properties).innerHTML = propertiesSummary();
    $(".body", properties).innerHTML = propertiesBody();
    propertiesWire();
  }
  const map = $("#map");
  if (map) $(".summary", map).textContent = `${state.run.branches.length} timelines from the setup snapshot`;
  if (Date.now() - (state.treeDrawn || 0) > 10000) { state.treeDrawn = Date.now(); mapDraw(); }
}

// Rendering -------------------------------------------------------------------------------
// How far the run is: by its time budget, or by its timelines.
function progress() {
  const run = state.run, info = run.run || {};
  if (run.state !== "running") return 1;
  if (info.time_budget_s) {
    const wall = run.branches.reduce((sum, b) => sum + b.wall_ns, 0) / Math.max(1, info.jobs || 1)
      + ((run.snapshot && run.snapshot.wall_ns) || 0);
    return Math.min(1, wall / (info.time_budget_s * 1e9));
  }
  return info.branches ? run.branches.length / info.branches : 0;
}
const duration = (s) => s >= 3600 ? `${(s / 3600).toFixed(1)} h` : s >= 60 ? `${(s / 60).toFixed(1)} min` : `${s.toFixed(1)} s`;
function statsHtml() {
  const run = state.run, info = run.run || {};
  const done = run.branches.length;
  const failing = run.branches.filter((branch) => branch.failing.length > 0).length;
  const list = properties();
  const failed = list.filter(isFailing).length;
  const vtime = run.branches.reduce((sum, b) => sum + b.vtime_ns, 0) / 1e9;
  const wall = (run.summary ? run.summary.wall_ns : run.branches.reduce((sum, b) => sum + b.wall_ns, 0)) / 1e9;
  const speed = run.summary && run.summary.vtime_per_wall ? `${run.summary.vtime_per_wall.toFixed(2)}× wall, one core` : "virtual seconds";
  const stat = (title, value, note, color = "") =>
    `<div class="stat"><div class="title">${title}</div><div class="value" style="color:${color}">${value}</div><div class="note">${note}</div></div>`;
  const planned = info.time_budget_s ? `budget ${duration(info.time_budget_s)}` : `of ${info.branches || "?"}`;
  return `<div class="stats" id="stats-live">
    ${stat("Timelines", done.toLocaleString(), `${planned} · ${duration(wall)} wall`)}
    ${stat("Failing", failing.toLocaleString(), "timelines with a failing property", failing ? "var(--fail)" : "var(--pass)")}
    ${stat("Properties", `${failed} / ${list.length}`, run.summary ? "failing" : "failing so far", failed ? "var(--fail)" : "var(--pass)")}
    ${stat("Virtual time", duration(vtime), speed)}
    ${stat("Behaviors", `<span id="behaviors">–</span>`, `<span id="behaviors-note">distinct, by timelines</span>`, "var(--accent)")}
  </div>`;
}
function chartsHtml() {
  const list = properties().filter(isFailing).sort((a, b) => b.branches_failing - a.branches_failing);
  const passing = properties().length - list.length;
  const most = Math.max(1, ...list.map((p) => p.branches_failing));
  const bars = list.slice(0, 7).map((p) => `<div class="bar" data-message="${escape(p.message)}" title="${escape(p.message)}">
      <span class="name">${escape(p.message)}</span><span class="track"><span class="fill" style="display:block;width:${100 * p.branches_failing / most}%"></span></span>
      <span class="count fail-text">${p.branches_failing || "never"}</span></div>`).join("");
  return `<div class="charts" id="charts-live">
    <div class="chart"><div class="head"><h3>New behavior discovery</h3><span>distinct behaviors by timelines</span></div>
      <div id="discovery" class="muted">Loading…</div></div>
    <div class="chart"><div class="head"><h3>Failing properties</h3><span>timelines failing each one</span></div>
      <div class="bars">${bars || `<div class="pass-text" style="padding:20px 0">Every property passes${state.run.summary ? "" : " so far"}.</div>`}
      ${passing ? `<div class="muted" style="margin-top:6px">${passing} passing</div>` : ""}</div></div>
  </div>`;
}

function render() {
  const run = state.run;
  const info = run.run || {};
  const done = run.branches.length;
  const isOpen = (id) => state.open.has(id);
  const header = `
    <div style="display:flex;align-items:baseline;gap:14px">
      <h2>Run ${run.id} ${info.scenario ? "· " + escape(info.scenario) : ""}</h2>${stateBadge(run.state)}
    </div>
    <div class="muted" style="margin-top:4px">${escape(info.program || info.compose || "")}
      ${info.profile ? "· profile " + escape(info.profile) : ""} · seed ${escape(info.seed || "")} · inputs ${escape(info.inputs || "")}
      ${info.strategy ? "· strategy " + escape(info.strategy) : ""}
      ${info.timeline_ms ? "· timelines of " + duration(info.timeline_ms / 1000) : ""}
      ${info.from_branch != null ? `· forked from branch ${info.from_branch} at ${info.from_vtime_ms}ms` : ""}</div>
    ${run.state === "running" ? `<div class="progress"><div style="width:${100 * progress()}%"></div></div>
      <button id="run-stop" style="margin-top:8px;font-size:12px;padding:2px 10px" data-tip="Stop this run: the timelines it explored so far stay">Stop run</button>` : ""}
    <div class="tabs view-tabs"><button data-view="report" class="${state.view === "report" ? "on" : ""}">Report</button>
      <button data-view="notebook" class="${state.view === "notebook" ? "on" : ""}">Notebook</button></div>`;
  if (state.view === "notebook") {
    $("#main").innerHTML = header + `<div id="notebook"></div>`;
    viewTabsWire();
    notebookOpen();
    return;
  }
  $("#main").innerHTML = header + statsHtml() + chartsHtml() + `
    ${sectionHtml("findings", "Findings", run.state === "running" ? "when the run finishes" : "", `<div id="findings-body" class="muted">${run.state === "running" ? "Compared with the previous run of this system once this one finishes." : "Loading…"}</div>`, isOpen("findings"))}
    ${sectionHtml("environment", "Environment", environmentSummary(), environmentBody(), isOpen("environment"))}
    ${sectionHtml("utilization", "Utilization", utilizationSummary(), utilizationBody(), isOpen("utilization"))}
    ${sectionHtml("properties", "Properties", propertiesSummary(), propertiesBody(), isOpen("properties"))}
    ${sectionHtml("map", "Multiverse tree", `${done} timelines from the setup snapshot`, `<div id="map-body" class="muted">Loading…</div>`, isOpen("map"))}
    ${sectionHtml("search", "Search", "events of every timeline", searchBody(), isOpen("search"))}
    ${sectionHtml("logs", "Logs", logsSummary(), logsBody(), isOpen("logs"))}
  `;
  viewTabsWire();
  document.querySelectorAll("section > header").forEach((header) => header.addEventListener("click", () => {
    const section = header.parentElement;
    section.classList.toggle("closed");
    if (section.classList.contains("closed")) state.open.delete(section.id); else state.open.add(section.id);
    if (section.id === "map" && !section.classList.contains("closed")) mapDraw();
  }));
  document.querySelectorAll(".bars .bar").forEach((bar) => bar.addEventListener("click", () => {
    state.open.add("properties");
    state.filter = bar.dataset.message;
    render();
    $("#properties").scrollIntoView({ behavior: "smooth" });
  }));
  propertiesWire();
  searchWire();
  mapDraw();
  findingsLoad();
  discoveryDraw();
  logsWire();
}

function viewTabsWire() {
  document.querySelectorAll(".view-tabs button").forEach((button) => button.addEventListener("click", () => {
    state.view = button.dataset.view;
    render();
  }));
  const stop = document.getElementById("run-stop");
  if (stop) stop.addEventListener("click", async () => {
    stop.disabled = true;
    await api(`/runs/${state.runId}/stop`, {}).catch(() => {});
    await runRefresh();
    runsRefresh();
  });
}

function sectionHtml(id, title, summary, body, open) {
  return `<section id="${id}" class="${open ? "" : "closed"}"><header><h3>${title}</h3>
    <span class="summary">${summary}</span></header><div class="body">${body}</div></section>`;
}

// Environment: what was tested (the resolved system recorded with the run).
function environmentSummary() {
  const system = (state.run.run || {}).system;
  return system ? escape(system.nodes.map((node) => node.name).join(", ")) : "";
}
function environmentBody() {
  const system = (state.run.run || {}).system;
  if (!system) return `<div class="muted">Not recorded for this run.</div>`;
  const faults = (node) => Object.entries(node.faults || {}).filter(([, on]) => on).map(([name]) => name).join(", ") || "none";
  return `<dl class="kv"><dt>Profile</dt><dd>${escape(system.profile)}</dd>
      <dt>Scenarios</dt><dd>${escape(system.scenarios.map((s) => s.name).join(", "))}</dd></dl>
    <table style="margin-top:10px"><tr><th>Node</th><th>Address</th><th>Content</th><th>Command</th><th>Ready</th><th>Limits</th><th>Faults allowed</th></tr>
    ${system.nodes.map((node) => `<tr><td>${escape(node.name)}</td><td class="mono">${escape(node.address)}</td>
      <td class="mono" title="${escape(node.digest)}">${escape(node.digest.slice(0, 19))}</td>
      <td class="mono">${escape(node.command.join(" "))}</td><td class="mono">${node.ready ? "tcp " + node.ready.tcp : ""}</td>
      <td>${[node.memory_max_mib ? node.memory_max_mib + " MiB" : "", node.privileged ? "privileged" : ""].filter(Boolean).join(", ")}</td>
      <td>${escape(faults(node))}</td></tr>`).join("")}</table>`;
