function utilizationSummary() {
  const vtime = state.run.branches.reduce((sum, branch) => sum + branch.vtime_ns, 0);
  return `${(vtime / 1e9).toFixed(1)} virtual seconds explored`;
}
function utilizationBody() {
  const run = state.run;
  const vtime = run.branches.reduce((sum, branch) => sum + branch.vtime_ns, 0);
  const wall = run.summary ? run.summary.wall_ns : run.branches.reduce((sum, b) => sum + b.wall_ns, 0);
  const rows = [
    ["Branches", `${run.branches.length} of ${(run.run || {}).branches || "?"}`],
    ["Virtual time", seconds(vtime)],
    ["Wall time", seconds(wall)],
    ["Virtual per wall (one core)", run.summary && run.summary.vtime_per_wall
      ? run.summary.vtime_per_wall.toFixed(2) + "×" : "–"],
    ["Exact stops", run.summary ? `largest skid ${run.summary.skid_max} branches, ${run.summary.overshoots} overshoots` : "–"],
  ];
  return `<dl class="kv">${rows.map(([key, value]) => `<dt>${key}</dt><dd>${escape(value)}</dd>`).join("")}</dl>
    <div class="muted" style="max-width:720px;margin-top:10px">New behavior discovery (above): a curve still climbing says run longer;
      one flat for long says these tests found what they can: strengthen them (more drivers, assertions, faults) to find more.</div>`;
}
async function discoveryDraw() {
  const box = $("#discovery");
  if (!box) return;
  let points;
  try { points = (await apiJson(`/runs/${state.runId}/discovery`)).points; } catch { box.textContent = "No events recorded."; return; }
  if (!points.length) { box.textContent = "No timelines yet."; return; }
  const width = Math.max(320, box.clientWidth), height = 170, left = 44, bottom = 22;
  const maxX = Math.max(1, points[points.length - 1][0]), maxY = Math.max(1, ...points.map((p) => p[1]));
  const x = (v) => left + (width - left - 12) * v / maxX, y = (v) => height - bottom - (height - bottom - 10) * v / maxY;
  const line = points.map(([b, n], i) => `${i ? "L" : "M"}${x(b).toFixed(1)},${y(n).toFixed(1)}`).join(" ");
  const area = `${line} L${x(maxX).toFixed(1)},${y(0)} L${x(0)},${y(0)} Z`;
  const ticksX = [0, 0.25, 0.5, 0.75, 1].map((f) => Math.round(maxX * f)).map((v) =>
    `<text x="${x(v)}" y="${height - 4}" fill="#9a9eab" font-size="10" text-anchor="middle">${v}</text>`).join("");
  const ticksY = [0, 0.5, 1].map((f) => Math.round(maxY * f)).map((v) =>
    `<text x="${left - 8}" y="${y(v) + 4}" fill="#9a9eab" font-size="10" text-anchor="end">${v.toLocaleString()}</text>
     <line x1="${left}" x2="${width - 12}" y1="${y(v)}" y2="${y(v)}" stroke="#30333d" stroke-dasharray="${v ? "2 4" : ""}"/>`).join("");
  box.innerHTML = `<svg width="${width}" height="${height}">${ticksY}<path d="${area}" fill="#8f7cf7" opacity=".14"/>
    <path d="${line}" fill="none" stroke="#8f7cf7" stroke-width="2.2"/>${ticksX}</svg>`;
  // Still rising: the last fifth of the timelines found new behaviors.
  const recent = points.filter(([b]) => b >= maxX * 0.8);
  const rising = recent.length > 1 && recent[recent.length - 1][1] > recent[0][1];
  if ($("#behaviors")) $("#behaviors").textContent = maxY.toLocaleString();
  if ($("#behaviors-note")) $("#behaviors-note").textContent = rising ? "still rising: run longer" : "flat lately";
}

// Properties: from the summary, or (while running) from the failing branches so far.
const builtin = new Set(["test commands exit successfully", "nodes do not exit unexpectedly",
  "no process crashes (segfault, illegal instruction, ...)",
  "the kernel kills no process for lack of memory", "the kernel reports no warnings, BUGs or hung tasks",
  "the guest finishes its scenario (no panic, hang or crash)"]);
function properties() {
  if (state.run.summary) return state.run.summary.properties;
  const failing = new Map();
  for (const branch of state.run.branches) for (const name of branch.failing) {
    const property = failing.get(name) || { kind: "?", message: name, branches_hit: 0, branches_failing: 0, example_branch: branch.index };
    property.branches_failing += 1;
    failing.set(name, property);
  }
  return [...failing.values()];
}
// The summary's verdict across the multiverse (a sometimes never true, a reachable never
// reached fail too); while a run goes, the violations seen so far.
const isFailing = (property) => property.failing ?? property.branches_failing > 0;
function propertiesSummary() {
  const list = properties();
  const failed = list.filter(isFailing).length;
  return `<span class="${failed ? "fail-text" : "pass-text"}">${failed} failing</span> of ${list.length}${state.run.summary ? "" : " (so far)"}`;
}
function propertiesBody() {
  const list = properties();
  const passed = list.filter((p) => !isFailing(p)).length;
  const counts = { all: list.length, passed, failed: list.length - passed };
  const tabs = ["all", "passed", "failed"].map((tab) =>
    `<button data-tab="${tab}" class="${state.tab === tab ? "on" : ""}">${tab[0].toUpperCase() + tab.slice(1)} ${counts[tab]}</button>`).join("");
  const shown = list.filter((p) => (state.tab === "all" || (state.tab === "passed") === !isFailing(p))
    && p.message.toLowerCase().includes(state.filter.toLowerCase()));
  const command = (p) => p.message.startsWith("test command ");
  const own = (p) => !builtin.has(p.message) && !command(p);
  const groups = [
    ["determinismo", shown.filter((p) => builtin.has(p.message))],
    ["Test commands", shown.filter(command)],
    ["Always assertions", shown.filter((p) => own(p) && p.kind.startsWith("always"))],
    ["Sometimes assertions", shown.filter((p) => own(p) && p.kind === "sometimes")],
    ["Reachability assertions", shown.filter((p) => own(p) && (p.kind === "reachable" || p.kind === "unreachable"))],
  ].filter(([, items]) => items.length);
  return `<div style="display:flex;gap:10px;align-items:center"><div class="tabs">${tabs}</div>
      <input id="property-filter" placeholder="Filter" value="${escape(state.filter)}" style="width:300px"></div>
    ${groups.map(([title, items]) => `<div class="group-title">${title}</div>${items.map(propertyHtml).join("")}`).join("")
      || `<div class="empty">No properties ${state.run.state === "running" ? "yet" : ""}</div>`}`;
}
function propertyHtml(property) {
  const failed = isFailing(property);
  return `<div class="property" data-message="${escape(property.message)}">
    <div class="row"><span class="badge ${failed ? "fail" : "pass"}">${failed ? "failed" : "passed"}</span>
      <span class="name">${escape(property.message)}${property.location ? ` <span class="muted mono" style="font-size:11px">${escape(property.location)}</span>` : ""}</span>
      <span class="counts">${escape(property.kind)} · hit in ${property.branches_hit}${property.kind === "sometimes" ? ` · true in ${property.branches_true ?? "?"}` : ""} · failing in ${property.branches_failing}</span></div>
    <div class="examples" hidden></div></div>`;
}
function propertiesWire() {
  document.querySelectorAll("[data-tab]").forEach((button) => button.addEventListener("click", (event) => {
    event.stopPropagation(); state.tab = button.dataset.tab; render();
  }));
  const filter = $("#property-filter");
  if (filter) filter.addEventListener("input", () => {
    state.filter = filter.value;
    const position = filter.selectionStart;
    render();
    const again = $("#property-filter"); again.focus(); again.setSelectionRange(position, position);
  });
  document.querySelectorAll(".property > .row").forEach((row) => row.addEventListener("click", () =>
    examplesToggle(row.parentElement)));
}

// Examples: the moments a property failed (and passed), by timeline.
async function examplesToggle(element) {
  const box = $(".examples", element);
  box.hidden = !box.hidden;
  if (box.hidden || box.dataset.loaded) return;
  box.innerHTML = `<div class="muted">Loading examples…</div>`;
  const message = element.dataset.message;
  const field = `assert.message=${quote(message)}`;
  try {
    const failing = await query({ condition: `${field} assert.condition=false or antithesis_assert.message=${quote(message)} antithesis_assert.condition=false`, output: "branches", limit: 1000000 });
    const passing = await query({ condition: `${field} assert.condition=true or antithesis_assert.message=${quote(message)} antithesis_assert.condition=true`, output: "branches", limit: 1000000 });
    const failingBranches = new Set(failing.map((example) => example.branch));
    const rows = [
      ...failing.slice(0, 10).map((example) => ({ ...example, failing: true })),
      ...passing.filter((example) => !failingBranches.has(example.branch)).slice(0, 5).map((example) => ({ ...example, failing: false })),
    ];
    box.dataset.loaded = "1";
    box.innerHTML = rows.length ? `<table><tr><th>Example</th><th>Branch</th><th>Time</th><th>Hits</th><th></th></tr>
      ${rows.map((row) => `<tr class="clickable" data-branch="${row.branch}" data-vtime="${row.first_vtime_ns}">
        <td class="${row.failing ? "fail-text" : "pass-text"}">${row.failing ? "Failing" : "Passing"}</td>
        <td class="mono">${row.branch}</td><td class="mono">${seconds(row.first_vtime_ns)}</td><td class="mono">${row.matches}</td>
        <td>${row.failing ? `<button class="causality" data-branch="${row.branch}" title="How likely the failure was at each moment of this timeline">Causality</button>` : ""}</td></tr>`).join("")}
      </table><div class="muted" style="margin-top:4px">${failing.length} failing timelines, ${passing.length} passing. Click an example for its logs.</div>
      <div class="causality-result"></div>`
      : `<div class="muted">No assertion events for this property (determinismo checks it when a timeline ends).</div>`;
    box.querySelectorAll("tr.clickable").forEach((row) => row.addEventListener("click", () =>
      logsOpen(Number(row.dataset.branch), Number(row.dataset.vtime))));
    box.querySelectorAll("button.causality").forEach((button) => button.addEventListener("click", (event) => {
      event.stopPropagation();
      causalityRun($(".causality-result", box), Number(button.dataset.branch), message);
    }));
  } catch (error) { box.innerHTML = `<div class="fail-text">${escape(error.message)}</div>`; }
}

// Findings: what changed since the previous run of the same system and scenario.
async function findingsLoad() {
  const body = $("#findings-body");
  if (!body || state.run.state === "running") return;
  let result;
  try { result = await apiJson(`/runs/${state.runId}/findings`); }
  catch { body.textContent = "No summary for this run."; return; }
  const counts = {};
  for (const finding of result.findings) counts[finding.finding] = (counts[finding.finding] || 0) + 1;
  const summary = $("#findings .summary");
  if (summary) summary.innerHTML = ["new", "ongoing", "resolved", "unseen"].filter((kind) => counts[kind])
    .map((kind) => `<span class="${kind === "resolved" ? "pass-text" : kind === "new" ? "fail-text" : ""}">${counts[kind]} ${kind}</span>`).join(", ")
    || (result.previous == null ? "first run of this system" : "nothing changed");
  const badge = { new: "fail", ongoing: "error", resolved: "pass", unseen: "error" };
  body.innerHTML = result.findings.length ? result.findings.map((finding) =>
    `<div class="property" style="cursor:pointer" data-goto="${escape(finding.message)}"><div class="row">
      <span class="badge ${badge[finding.finding]}">${finding.finding.toUpperCase()}</span>
      ${finding.rare ? `<span class="badge running" title="Only one timeline showed it: the next run may miss it">RARE</span>` : ""}
      <span class="name">${escape(finding.message)}</span><span class="counts">${escape(finding.kind)}</span></div></div>`).join("")
    + `<div class="muted" style="margin-top:6px">${result.previous == null ? "No earlier run of this system and scenario: every failure is new." : `Compared with run ${result.previous}.`}</div>`
    : `<div class="muted">${result.previous == null ? "First run of this system and scenario, and nothing failed." : `Nothing changed since run ${result.previous}.`}</div>`;
  body.querySelectorAll("[data-goto]").forEach((element) => element.addEventListener("click", () => {
    const property = document.querySelector(`.property[data-message="${CSS.escape(element.dataset.goto)}"]`);
    if (!property) return;
    property.scrollIntoView({ behavior: "smooth", block: "center" });
    if ($(".examples", property).hidden) examplesToggle(property);
  }));
}

// Causality analysis (causality.zig): the failure's probability at moments of the timeline,
// from futures forked there. Jumps mark where the timeline made the bug likely.
async function causalityRun(box, branch, property) {
  box.innerHTML = `<div class="muted">Causality of branch ${branch}: forking futures…</div>`;
  let job;
  try { job = await apiJson(`/runs/${state.runId}/causality`, { branch, property, points: 10, futures: 16 }); }
  catch (error) { box.innerHTML = `<div class="fail-text">${escape(error.message)}</div>`; return; }
  for (;;) {
    const result = await apiJson(`/runs/${state.runId}/causality/${job.id}`);
    box.innerHTML = causalityChart(branch, result.points, result.done);
    box.querySelectorAll("[data-vtime]").forEach((bar) => bar.addEventListener("click", () =>
      logsOpen(branch, Number(bar.dataset.vtime))));
    if (result.done) return;
    await new Promise((resolve) => setTimeout(resolve, 2000));
  }
}
function causalityChart(branch, points, done) {
  if (!points.length) return `<div class="muted">Causality of branch ${branch}: ${done ? "the property did not fail again" : "forking futures…"}</div>`;
  const width = 520, height = 140, left = 36, bottom = 22, step = (width - left) / points.length;
  const bars = points.map((point, i) => {
    const h = (height - bottom - 8) * point.probability;
    const html = `<div class="t-title">${point.vtime_ms} ms: ${(point.probability * 100).toFixed(0)}% likely to fail</div>
      ${point.failing} of ${point.futures} futures forked here fail.<div class="t-foot">Click for the logs up to here</div>`;
    return `<g data-vtime="${point.vtime_ms * 1e6}" style="cursor:pointer" ${tipAttr(html)}><rect x="${left + i * step + 2}" y="${height - bottom - h}"
      width="${step - 4}" height="${Math.max(h, 1)}" fill="${point.probability >= 0.99 ? "#f0506e" : "#8f7cf7"}"></rect>
      <text x="${left + i * step + step / 2}" y="${height - 6}" fill="#9a9eab" font-size="9" text-anchor="middle">${point.vtime_ms}</text></g>`;
  }).join("");
  const axis = [0, 0.5, 1].map((p) => `<text x="${left - 6}" y="${height - bottom - (height - bottom - 8) * p + 3}" fill="#9a9eab" font-size="9" text-anchor="end">${p * 100}%</text>`).join("");
  return `<div class="group-title">Causality of branch ${branch}${done ? "" : " (running)"}: probability of the failure, by moment (ms)</div>
    <svg width="${width}" height="${height}">${axis}${bars}</svg>
    <div class="muted">A jump means the timeline made the bug likely just before: click the bar after it for the logs up to there.</div>`;
}

// Tooltips: any element with data-tip (HTML) shows it in one styled tooltip near the pointer.
(() => {
  const tip = document.getElementById("tip");
  let shown = null;
  const place = (event) => {
    const pad = 14, width = tip.offsetWidth, height = tip.offsetHeight;
    let left = event.clientX + pad, top = event.clientY + pad;
    if (left + width > innerWidth - 8) left = event.clientX - width - pad;
    if (top + height > innerHeight - 8) top = event.clientY - height - pad;
    tip.style.left = Math.max(8, left) + "px";
    tip.style.top = Math.max(8, top) + "px";
  };
  document.addEventListener("mouseover", (event) => {
    const target = event.target.closest && event.target.closest("[data-tip]");
    if (target === shown) return;
    shown = target;
    if (!target) { tip.classList.remove("on"); return; }
    tip.innerHTML = target.dataset.tip;
    tip.classList.add("on");
    place(event);
  });
  document.addEventListener("mousemove", (event) => { if (shown) place(event); });
})();
const tipAttr = (html) => `data-tip="${escape(html)}"`;
const ms = (ns) => ns >= 1e9 ? `${(ns / 1e9).toFixed(2)} s` : ns >= 1e6 ? `${(ns / 1e6).toFixed(1)} ms` : `${(ns / 1e3).toFixed(0)} µs`;
const humanize = (key) => key.replace(/_ns$/, "").replace(/_ppm$/, "").replace(/_/g, " ");
function kvHtml(pairs) {
  const rows = pairs.filter(([, value]) => value !== undefined && value !== null && value !== "");
  return rows.length ? `<dl class="t-kv">${rows.map(([key, value]) => `<dt>${escape(key)}</dt><dd>${escape(value)}</dd>`).join("")}</dl>` : "";
}
function pathHtml(branch) {
  const steps = (branch.path || []).map((step) => `<span class="t-chip">#${step.branch} @ ${(step.vtime_ns / 1e9).toFixed(2)}s</span><span class="muted">→</span>`);
  return `<div class="t-path"><span class="t-chip">snapshot</span><span class="muted">→</span>${steps.join("")}<span class="t-chip" style="border-color:var(--accent)">#${branch.index}</span></div>`;
}
function timelineTip(branch, run) {
  const failing = branch.failing.length;
  const why = branch.why || ((branch.path || []).length ? "" : "From the setup snapshot: the first generation, or a flat exploration.");
  return `<div class="t-title"><span class="t-dot" style="background:${failing ? "var(--fail)" : "var(--pass)"}"></span>
      ${run ? `Run ${run} · ` : ""}Timeline #${branch.index}</div>
    ${pathHtml(branch)}
    ${kvHtml([["ended", `${branch.outcome} at ${(branch.vtime_ns / 1e9).toFixed(3)}s`], ["events", branch.events],
      ["generation", branch.generation || undefined]])}
    ${failing ? `<div class="t-fail">${branch.failing.map((name) => "✗ " + escape(name)).join("<br>")}</div>` : `<div class="pass-text">✓ every property passes</div>`}
    ${why ? `<div class="t-why"><b>Why it starts here</b><br>${escape(why)}</div>` : ""}
    <div class="t-foot">Click for its logs</div>`;
}
// A fault in words: what it does, to what, for how long.
function faultTip(event, decision) {
  const d = (event.event && event.event.details) || {};
  const kind = [d.kind, d.flavor].filter(Boolean).join(" · ");
  const between = d.node ? (d.peer ? `${d.node} ↔ ${d.peer}` : d.node) : "";
  const netem = d.netem || {};
  const groups = Array.isArray(d.groups) && d.groups.some((g) => g !== 255) ? d.groups.filter((g) => g !== 255).join(" | ") : undefined;
  const pairs = [["between", between || undefined], ["for", d.duration_ns ? ms(d.duration_ns) : undefined],
    ["delay", netem.delay_ns ? `${ms(netem.delay_ns)}${netem.jitter_ns ? " ± " + ms(netem.jitter_ns) : ""}` : undefined],
    ["loss", netem.loss_ppm ? `${(netem.loss_ppm / 1e4).toFixed(1)}%` : undefined],
    ["duplicates", netem.duplicate_percent ? netem.duplicate_percent + "%" : undefined],
    ["corruption", netem.corrupt_percent ? netem.corrupt_percent + "%" : undefined],
    ["reordering", netem.reorder_percent ? netem.reorder_percent + "%" : undefined],
    ["rate", netem.rate_bytes_per_second ? `${netem.rate_bytes_per_second} B/s` : undefined],
    ["cpu", d.cpu_percent ? d.cpu_percent + "%" : undefined], ["clock skip", d.skip_ns ? ms(d.skip_ns) : undefined],
    ["groups", groups], ["permanent", d.permanent ? "yes" : undefined], ["program", d.program || undefined]];
  const why = d.injected ? `<div class="t-why"><b>Why this fault</b><br>The scenario asked for it (sdk.fault or det-faults inject), at this moment.</div>`
    : decision ? `<div class="t-why"><b>Why this fault</b><br>${escape(decision.event.details.reason)}</div>`
    : `<div class="t-why"><b>Why this fault</b><br>Chosen at random from this timeline's seed (a replay chooses the same). A strategy (mutate, the LLM) gives its reasons here.</div>`;
  return `<div class="t-title"><span class="t-dot" style="background:var(--warn);border-radius:2px"></span>Fault: ${escape(kind || "fault")}</div>
    ${kvHtml(pairs)}${kvHtml([["timeline", `#${event.branch} at ${(event.vtime_ns / 1e9).toFixed(3)}s`]])}${why}
    <div class="t-foot">Click for the logs here</div>`;
}
function failureTip(event) {
  const a = event.event.assert || event.event.antithesis_assert || {};
  const details = a.details && typeof a.details === "object" ? Object.entries(a.details).slice(0, 8).map(([k, v]) => [k, typeof v === "object" ? JSON.stringify(v) : String(v)]) : [];
  const where = a.location ? `${(a.location.file || "").split("/").pop()}:${a.location.line} ${a.location.function || ""}` : undefined;
  return `<div class="t-title"><span class="t-dot" style="background:var(--fail)"></span>${escape(a.type || "assertion")} failed</div>
    <div>${escape(a.message || "")}</div>${kvHtml(details)}${kvHtml([["where", where], ["timeline", `#${event.branch} at ${(event.vtime_ns / 1e9).toFixed(3)}s`]])}
    <div class="t-foot">The first failure of this timeline · click for the logs here</div>`;
}
function branchPointTip(point, why) {
  return `<div class="t-title"><span class="t-dot" style="background:#15161a;border:1.5px solid #e6e7eb"></span>Branch point</div>
    <div>${point.count} timelines continue #${point.from} from ${(point.vtime / 1e9).toFixed(3)}s: everything before is shared, each goes on with its own decisions.</div>
    ${why ? `<div class="t-why"><b>Why here</b><br>${escape(why)}</div>` : ""}`;
}

// Multiverse tree: boot to the setup snapshot is the trunk; every timeline branches from the
// snapshot (or, for a fork, from its moment of a parent timeline), with its faults and failed
// assertions where they happened. Runs forked from this run's timelines are subtrees, drawn
// under the timeline they branch from.
async function mapDraw() {
  const body = $("#map-body");
  if (!body || $("#map").classList.contains("closed")) return;
  const run = state.run, info = run.run || {};
  const branches = run.branches.slice().sort((a, b) => a.index - b.index);
  if (!branches.length) { body.textContent = "No timelines yet."; return; }
  let failures = [], faults = [], decisions = [];
  try {
    failures = await query({ condition: "assert.condition=false or antithesis_assert.condition=false", limit: 20000 });
    faults = await query({ condition: "event=fault", limit: 20000 });
    decisions = await query({ condition: "event=decision", limit: 20000 });
  } catch { /* The tree still shows the timelines. */ }
  // A strategy's reason for a fault: its last decision for the fault injector before it.
  const decisionsOf = new Map();
  for (const d of decisions) {
    if (!decisionsOf.has(d.branch)) decisionsOf.set(d.branch, []);
    decisionsOf.get(d.branch).push(d);
  }
  const decisionFor = (fault) => {
    let found = null;
    for (const d of decisionsOf.get(fault.branch) || []) {
      if (d.vtime_ns > fault.vtime_ns) break;
      if ((d.event.details || {}).source === "det-faults") found = d;
    }
    return found;
  };
  const forkedHere = info.from_branch != null;
  const children = [...details.values()].filter((other) => other.id !== run.id && other.run && !forkedHere
    && other.run.from_branch != null && other.run.inputs === info.inputs && other.run.seed === info.seed
    && other.run.scenario === info.scenario && other.branches.length);
  // The tree explorer's parentage: a timeline's path ends with its parent and the moment it
  // left it. Rows go depth first, each timeline right under its parent: the parent's line is
  // their shared prefix, and the child leaves it where it diverged.
  const byIndex = new Map(branches.map((b) => [b.index, b]));
  const parentOf = (b) => b.path && b.path.length ? b.path[b.path.length - 1] : null;
  const kids = new Map();
  for (const b of branches) {
    const parent = parentOf(b);
    const key = parent && byIndex.has(parent.branch) ? parent.branch : "root";
    if (!kids.has(key)) kids.set(key, []);
    kids.get(key).push(b);
  }
  const rows = [];
  const place = (branch, parentRow) => {
    rows.push({ branch, parentRow, parent: parentOf(branch) });
    const at = rows.length - 1;
    for (const kid of (kids.get(branch.index) || []).sort((a, b) => a.index - b.index)) place(kid, at);
    for (const child of children.filter((c) => c.run.from_branch === branch.index)) {
      for (const sub of child.branches.slice().sort((a, b) => a.index - b.index)) {
        rows.push({ branch: sub, child, parentRow: at });
      }
    }
  };
  for (const b of (kids.get("root") || []).sort((a, b) => a.index - b.index)) place(b, null);
  const snapshotNs = run.snapshot ? run.snapshot.vtime_ns
    : Math.min(...failures.concat(faults).map((e) => e.vtime_ns), ...branches.map((b) => b.vtime_ns)) * 0.98;
  const rootNs = forkedHere ? info.from_vtime_ms * 1e6 : snapshotNs;
  // A few much longer timelines would squash the rest: the scale ends past most of them (the
  // longer ones are cut at the edge, ›); zooming and panning reach the rest.
  const ends = rows.map((r) => r.branch.vtime_ns).sort((a, b) => a - b);
  const longest = ends[ends.length - 1], typical = ends[Math.floor(0.95 * (ends.length - 1))];
  const endNs = longest - rootNs > 1.6 * (typical - rootNs) ? rootNs + 1.15 * (typical - rootNs) : longest;
  const rowOf = new Map(rows.filter((r) => !r.child).map((r) => [r.branch.index, rows.indexOf(r)]));
  const firstFailures = new Map();
  for (const e of failures) {
    // Its own first failure: what came before its branch point is its ancestors'.
    const branch = byIndex.get(e.branch), parent = branch && parentOf(branch);
    if (parent && e.vtime_ns <= parent.vtime_ns) continue;
    if (!firstFailures.has(e.branch) || firstFailures.get(e.branch).vtime_ns > e.vtime_ns) firstFailures.set(e.branch, e);
  }
  const points = new Map();
  for (const row of rows) if (!row.child && row.parentRow != null) {
    const key = `${row.parentRow}:${row.parent.vtime_ns}`;
    if (!points.has(key)) points.set(key, { row: row.parentRow, vtime: row.parent.vtime_ns, count: 0, from: rows[row.parentRow].branch.index, why: "" });
    const point = points.get(key);
    point.count += 1;
    if (row.branch.why) point.why = row.branch.why;
  }
  const model = { rows, rowOf, faults, firstFailures: [...firstFailures.values()], points: [...points.values()], children,
    decisionFor, forkedHere, info, snapshotNs, rootNs, endNs, longest, depthMax: Math.max(0, ...branches.map((b) => (b.path || []).length)) };
  const full = { t0: rootNs, t1: endNs, r0: 0, r1: rows.length };
  const branched = rows.filter((r) => !r.child && r.parentRow != null).length;
  body.innerHTML = `<div class="muted" style="margin-bottom:6px">${model.depthMax
      ? `Branched up to ${model.depthMax} deep: ${branched} timelines continue another from a moment (◯), sharing everything before it.`
      : "Every timeline starts from the setup snapshot (flat branching)."}</div>
    <div class="legend"><span><i style="background:#9a9eab"></i>boot to snapshot</span>
      <span><i style="background:#3fbf7f"></i>passing timeline</span><span><i style="background:#f0506e"></i>failing timeline</span>
      <span><i style="background:#f0a650"></i>fault</span><span><i style="background:#f0506e;border-radius:50%"></i>failed assertion</span>
      <span><i style="background:#e6e7eb;border-radius:50%"></i>branch point</span><span><i style="background:#8f7cf7"></i>fork (a subtree: another run)</span></div>
    <div class="map tree" style="cursor:grab;touch-action:none"></div>
    <div class="muted">Hover for details and why; click a timeline (or a mark) for its logs at that moment. Scroll to zoom (time and timelines), drag to pan, double-click to see it all.</div>`;
  const container = body.querySelector(".tree");
  let view = { ...full };
  const draw = () => {
    container.innerHTML = treeSvg(model, view, Math.max(720, body.clientWidth - 4));
    container.querySelectorAll(".timeline, .mark, .fork").forEach((element) => element.addEventListener("click", (event) => {
      event.stopPropagation();
      if (element.dataset.run) { runOpen(Number(element.dataset.run)); return; }
      logsOpen(Number(element.dataset.branch), Number(element.dataset.vtime));
    }));
  };
  draw();
  // Zoom and pan change the window of time and timelines shown; the tree is drawn again at
  // its size (not magnified). A drag past a few pixels is not a click.
  const layout = () => treeLayout(model, view, Math.max(720, body.clientWidth - 4));
  let frame = null;
  const redraw = () => { if (!frame) frame = requestAnimationFrame(() => { frame = null; draw(); }); };
  container.addEventListener("wheel", (event) => {
    event.preventDefault();
    const { x0, x1, top, rowHeight } = layout();
    const box = container.getBoundingClientRect();
    const factor = Math.exp(event.deltaY * 0.0015);
    const px = Math.min(1, Math.max(0, (event.clientX - box.left - x0) / (x1 - x0)));
    const at = view.t0 + (view.t1 - view.t0) * px;
    const span = Math.min(full.t1 - full.t0, Math.max(1e6, (view.t1 - view.t0) * factor));
    view.t0 = Math.max(full.t0 - span * 0.05, at - span * px);
    view.t1 = view.t0 + span;
    const rowAt = view.r0 + (event.clientY - box.top - top) / rowHeight;
    const rows = Math.min(full.r1, Math.max(6, (view.r1 - view.r0) * factor));
    const py = Math.min(1, Math.max(0, (rowAt - view.r0) / (view.r1 - view.r0)));
    view.r0 = Math.min(Math.max(0, rowAt - rows * py), full.r1 - rows);
    view.r1 = view.r0 + rows;
    redraw();
  }, { passive: false });
  let drag = null;
  container.addEventListener("pointerdown", (event) => { drag = { x: event.clientX, y: event.clientY, view: { ...view }, moved: false }; });
  container.addEventListener("pointermove", (event) => {
    if (!drag) return;
    const dx = event.clientX - drag.x, dy = event.clientY - drag.y;
    if (!drag.moved && Math.hypot(dx, dy) < 4) return;
    if (!drag.moved) { container.setPointerCapture(event.pointerId); container.style.cursor = "grabbing"; drag.moved = true; }
    const { x0, x1, rowHeight } = layout();
    const dt = -dx * (drag.view.t1 - drag.view.t0) / (x1 - x0);
    const dr = Math.min(Math.max(-drag.view.r0, -dy / rowHeight), full.r1 - drag.view.r1);
    view = { t0: drag.view.t0 + dt, t1: drag.view.t1 + dt, r0: drag.view.r0 + dr, r1: drag.view.r1 + dr };
    redraw();
  });
  const release = () => { if (drag && drag.moved) container.dataset.dragged = "1"; drag = null; container.style.cursor = "grab"; };
  container.addEventListener("pointerup", release);
  container.addEventListener("pointercancel", release);
  container.addEventListener("click", (event) => {
    if (container.dataset.dragged) { delete container.dataset.dragged; event.stopPropagation(); event.preventDefault(); }
  }, true);
  container.addEventListener("dblclick", () => { view = { ...full }; redraw(); });
}

// Where things go for a window of the tree: time t0..t1 across, timelines r0..r1 down.
function treeLayout(model, view, width) {
  // The plot keeps the height it has with every timeline shown: zooming spreads fewer rows over it.
  const visible = view.r1 - view.r0;
  const plot = Math.max(3, Math.min(14, 760 / model.rows.length)) * model.rows.length;
  const rowHeight = Math.max(plot, 160) / visible;
  const top = 34, height = top + Math.max(plot, 160) + 34;
  const snapshotX = 150, fan = Math.min(70, 8 + visible * 1.5);
  const rootX = model.forkedHere ? snapshotX + 110 : snapshotX;
  const x0 = rootX + fan, x1 = width - 46;
  return { rowHeight, top, height, snapshotX, rootX, fan, x0, x1, width };
}

function treeSvg(model, view, width) {
  const { rows, rowOf, info, forkedHere, snapshotNs, rootNs } = model;
  const { rowHeight, top, height, snapshotX, rootX, fan, x0, x1 } = treeLayout(model, view, width);
  const x = (ns) => x0 + (x1 - x0) * (ns - view.t0) / Math.max(1, view.t1 - view.t0);
  const y = (i) => top + (i - view.r0) * rowHeight + rowHeight / 2;
  const shown = (i) => i >= view.r0 - 1 && i <= view.r1;
  const inTime = (ns) => ns >= view.t0 && ns <= view.t1;
  const whole = view.r0 === 0 && view.r1 === rows.length && view.t0 <= rootNs;
  // The snapshot (the fan's root): at its place in time, or at the left edge when out of view.
  const rootPoint = { x: whole ? rootX : Math.max(x0 - fan, Math.min(x(rootNs), x1)), y: y((rows.length - 1) / 2) };
  const color = (branch) => branch.failing.length ? "#f0506e" : "#3fbf7f";
  const stroke = Math.max(1, Math.min(1.8, rowHeight / 5));
  const lines = rows.map((row, i) => {
    if (!shown(i) && !(row.parentRow != null && shown(row.parentRow))) return "";
    const b = row.branch, yy = y(i), end = Math.min(x1, x(b.vtime_ns));
    const tip = tipAttr(timelineTip(b, row.child && row.child.id));
    const hit = `<line x1="${x0 - fan}" x2="${x1}" y1="${yy}" y2="${yy}" stroke="transparent" stroke-width="${Math.max(rowHeight, 4)}"/>`;
    if (row.child) {
      const fx = x(row.child.run.from_vtime_ms * 1e6), fy = y(row.parentRow);
      return `<g class="timeline" data-run="${row.child.id}" style="cursor:pointer" ${tip}>
        <path d="M${fx},${fy} C${fx + 24},${fy} ${fx + 16},${yy} ${fx + 40},${yy} L${Math.max(fx + 40, end)},${yy}" fill="none" stroke="#8f7cf7" stroke-opacity=".75" stroke-width="${stroke}"/>${hit}</g>`;
    }
    if (row.parentRow != null) {
      // Left its parent's line at the moment it diverged: everything before is shared.
      const fx = x(row.parent.vtime_ns), fy = y(row.parentRow);
      return `<g class="timeline" data-branch="${b.index}" data-vtime="${b.vtime_ns}" style="cursor:pointer" ${tip}>
        <path d="M${fx},${fy} C${fx + 18},${fy} ${fx + 10},${yy} ${fx + 30},${yy} L${Math.max(fx + 30, end)},${yy}" fill="none" stroke="${color(b)}" stroke-opacity=".75" stroke-width="${stroke}"/>${hit}</g>`;
    }
    const start = whole ? x0 : Math.max(x0, x(rootNs) + fan);
    return `<g class="timeline" data-branch="${b.index}" data-vtime="${b.vtime_ns}" style="cursor:pointer" ${tip}>
      <path d="M${rootPoint.x},${rootPoint.y} C${rootPoint.x + fan * 0.6},${rootPoint.y} ${start - fan * 0.4},${yy} ${start},${yy} L${Math.max(start, end)},${yy}" fill="none" stroke="${color(b)}" stroke-opacity=".65" stroke-width="${stroke}"/>${hit}</g>`;
  }).join("");
  const size = Math.max(3, Math.min(10, rowHeight * 0.75));
  const mark = (e, kind) => {
    const row = rowOf.get(e.branch);
    if (row === undefined || !shown(row) || !inTime(e.vtime_ns)) return "";
    // Before its branch point, an event is its ancestors': drawn on their lines.
    const parent = rows[row].parent;
    if (parent && e.vtime_ns <= parent.vtime_ns) return "";
    const xx = x(e.vtime_ns), yy = y(row);
    const html = kind === "fault" ? faultTip(e, model.decisionFor(e)) : failureTip(e);
    return kind === "fault"
      ? `<rect class="mark" data-branch="${e.branch}" data-vtime="${e.vtime_ns}" x="${xx - 1.25}" y="${yy - size / 2}" width="2.5" height="${size}" fill="#f0a650" style="cursor:pointer" ${tipAttr(html)}></rect>`
      : `<circle class="mark" data-branch="${e.branch}" data-vtime="${e.vtime_ns}" cx="${xx}" cy="${yy}" r="${Math.max(2.5, size / 2)}" fill="#f0506e" style="cursor:pointer" ${tipAttr(html)}></circle>`;
  };
  const branchPoints = model.points.filter((p) => shown(p.row) && inTime(p.vtime)).map((point) =>
    `<circle cx="${x(point.vtime)}" cy="${y(point.row)}" r="${Math.max(3, Math.min(6, rowHeight / 2))}" fill="#15161a" stroke="#e6e7eb" stroke-width="1.5" ${tipAttr(branchPointTip(point, point.why))}></circle>`).join("");
  const forkPoints = model.children.map((child) => {
    const row = rowOf.get(child.run.from_branch) ?? 0, at = child.run.from_vtime_ms * 1e6;
    if (!shown(row) || !inTime(at)) return "";
    const fx = x(at), fy = y(row);
    const forkTip = `<div class="t-title"><span class="t-dot" style="background:var(--accent)"></span>Fork · run ${child.id}</div>
      <div>${child.branches.length} timelines from #${child.run.from_branch} at ${child.run.from_vtime_ms} ms, explored as their own run.</div>
      <div class="t-why"><b>Why here</b><br>Someone forked this moment (from the logs, the API or MCP).</div><div class="t-foot">Click to open the run</div>`;
    return `<g class="fork" data-run="${child.id}" style="cursor:pointer" ${tipAttr(forkTip)}><circle cx="${fx}" cy="${fy}" r="5" fill="#8f7cf7"/>
      <text x="${fx - 8}" y="${fy - 7}" fill="#8f7cf7" font-size="10.5" text-anchor="end">run ${child.id} · #${child.run.from_branch} at ${(at / 1e9).toFixed(2)}s</text></g>`;
  }).join("");
  const cut = rows.map((row, i) => shown(i) && row.branch.vtime_ns > view.t1 && x(row.branch.vtime_ns) > x1
    ? `<text x="${x1 + 1}" y="${y(i) + 3.5}" fill="#9a9eab" font-size="11">›</text>` : "").join("");
  const labelEvery = Math.ceil(12 / rowHeight);
  const labels = rows.map((row, i) => !row.child && shown(i) && i % labelEvery === 0
    ? `<text x="${x1 + 10}" y="${y(i) + 3.5}" fill="#9a9eab" font-size="10" font-family="var(--mono)">#${row.branch.index}</text>` : "").join("");
  const ticks = Array.from({ length: 6 }, (_, i) => view.t0 + (view.t1 - view.t0) * i / 5).map((ns) =>
    `<text x="${x(ns)}" y="${height - 8}" fill="#9a9eab" font-size="10.5" text-anchor="middle">${(ns / 1e9).toFixed(view.t1 - view.t0 < 1e9 ? 3 : 2)}s</text>`).join("");
  const trunk = !whole ? "" : `<line x1="16" y1="${rootPoint.y}" x2="${snapshotX}" y2="${rootPoint.y}" stroke="#9a9eab" stroke-width="3"/>
    <text x="16" y="${rootPoint.y - 9}" fill="#9a9eab" font-size="10.5">boot · 0s</text>
    ${forkedHere ? `<line x1="${snapshotX}" y1="${rootPoint.y}" x2="${rootX}" y2="${rootPoint.y}" stroke="#8f7cf7" stroke-width="3"/>
      <text x="${(snapshotX + rootX) / 2}" y="${rootPoint.y - 9}" fill="#8f7cf7" font-size="10.5" text-anchor="middle">#${info.from_branch}</text>
      <circle cx="${rootX}" cy="${rootPoint.y}" r="6" fill="#8f7cf7"/>
      <text x="${rootX}" y="${rootPoint.y + 22}" fill="#8f7cf7" font-size="11" text-anchor="middle">fork · ${(info.from_vtime_ms / 1000).toFixed(2)}s</text>` : ""}
    <circle cx="${snapshotX}" cy="${rootPoint.y}" r="7" fill="#15161a" stroke="#e6e7eb" stroke-width="2.5" ${tipAttr(`<div class="t-title">The setup snapshot</div>The system booted and is ready (setup_complete) at ${(snapshotNs / 1e9).toFixed(3)}s. Every timeline starts here, or from a moment of one that did.`)}></circle>
    <text x="${snapshotX}" y="${rootPoint.y + (forkedHere ? -14 : 24)}" fill="#e6e7eb" font-size="11" text-anchor="middle">setup snapshot</text>
    ${forkedHere ? "" : `<text x="${snapshotX}" y="${rootPoint.y + 38}" fill="#9a9eab" font-size="10.5" text-anchor="middle">${(snapshotNs / 1e9).toFixed(2)}s</text>`}`;
  const zoomed = whole ? "" : `<text x="${x0 - fan}" y="16" fill="#9a9eab" font-size="10.5">zoomed: ${(view.t0 / 1e9).toFixed(3)}s to ${(view.t1 / 1e9).toFixed(3)}s · timelines ${Math.round(view.r0) + 1} to ${Math.round(view.r1)} of ${rows.length}</text>`;
  return `<svg width="${width}" height="${height}"><defs><clipPath id="tree-clip"><rect x="${x0 - fan}" y="0" width="${x1 - x0 + fan + 2}" height="${height}"/></clipPath></defs>
    ${trunk}${zoomed}<g clip-path="url(#tree-clip)">${lines}${model.faults.map((e) => mark(e, "fault")).join("")}
    ${model.firstFailures.map((e) => mark(e, "failure")).join("")}${branchPoints}${forkPoints}</g>${cut}${labels}${ticks}</svg>`;
}

// Search: conditions and temporal conditions over every timeline (src/query.zig).
function searchBody() {
  return `<div class="search-form">
    <input id="q-condition" placeholder='Condition, e.g. assert.condition=false   or   output.text~"connection refused"   or   event=fault details.kind=partition'>
    <div class="temporal"><select id="q-temporal"><option value="">no temporal condition</option>
        <option value="preceded_by">preceded by</option><option value="not_preceded_by">not preceded by</option>
        <option value="followed_by">followed by</option><option value="not_followed_by">not followed by</option></select>
      <input id="q-temporal-condition" placeholder="event=fault"><input id="q-within" placeholder="within (s)" type="number" step="any"></div>
    <div class="actions"><select id="q-output"><option value="events">events</option><option value="branches">timelines</option><option value="count">count</option></select>
      <button class="primary" id="q-run">Search</button><span class="muted" id="q-status"></span></div>
    <div id="q-results"></div></div>`;
}
function searchWire() {
  const button = $("#q-run");
  if (!button) return;
  const run = async () => {
    const request = { condition: $("#q-condition").value.trim(), output: $("#q-output").value, limit: 500 };
    if (!request.condition) return;
    const temporal = $("#q-temporal").value, other = $("#q-temporal-condition").value.trim();
    if (temporal && other) request[temporal] = other;
    if ($("#q-within").value) request.within = Number($("#q-within").value);
    $("#q-status").textContent = "Searching…";
    try {
      const results = await query(request);
      $("#q-status").textContent = "";
      $("#q-results").innerHTML = resultsHtml(request.output, results);
      $("#q-results").querySelectorAll("tr.clickable").forEach((row) => row.addEventListener("click", () =>
        logsOpen(Number(row.dataset.branch), Number(row.dataset.vtime))));
    } catch (error) { $("#q-status").innerHTML = `<span class="fail-text">${escape(error.message)}</span>`; }
  };
  button.addEventListener("click", run);
  $("#q-condition").addEventListener("keydown", (event) => { if (event.key === "Enter") run(); });
}
function resultsHtml(output, results) {
  if (output === "count") {
    const count = results[0] || { events: 0, branches: 0, timelines: 0 };
    return `<p>${count.events} events in ${count.branches} of ${count.timelines} timelines</p>`;
  }
  if (!results.length) return `<p class="muted">Nothing matched.</p>`;
  if (output === "branches") {
    return `<table><tr><th>Branch</th><th>Matches</th><th>First at</th></tr>${results.map((r) =>
      `<tr class="clickable" data-branch="${r.branch}" data-vtime="${r.first_vtime_ns}"><td class="mono">${r.branch}</td>
       <td class="mono">${r.matches}</td><td class="mono">${seconds(r.first_vtime_ns)}</td></tr>`).join("")}</table>`;
  }
  return `<table><tr><th>Branch</th><th>Time</th><th>Event</th></tr>${results.map((r) => {
    const { kind, text, css } = describe(r.event);
    return `<tr class="clickable" data-branch="${r.branch}" data-vtime="${r.vtime_ns}"><td class="mono">${r.branch}</td>
      <td class="mono">${seconds(r.vtime_ns)}</td><td><span class="kind ${css}">${escape(kind)}</span> <span class="mono">${escape(text)}</span></td></tr>`;
  }).join("")}</table>`;
}

// Logs: a timeline's events up to a moment, and what to do there.
// Only the Logs section changes: what is expanded elsewhere (examples, search) stays.
async function logsOpen(branch, vtime_ns) {
  state.logs = { branch, vtime_ns, events: null, filter: "" };
  state.open.add("logs");
  const section = $("#logs");
  section.classList.remove("closed");
  $(".summary", section).textContent = logsSummary();
  $(".body", section).innerHTML = logsBody();
  section.scrollIntoView({ behavior: "smooth" });
  await logsLoad();
}
function logsSummary() {
  return state.logs ? `branch ${state.logs.branch} up to ${seconds(state.logs.vtime_ns)}`
    : "pick an example, a search result or a timeline";
}
async function logsLoad() {
  const logs = state.logs;
  const condition = logs.filter || "seq>=0";
  try {
    // A tree explorer's timeline begins inside its ancestors (queries give its whole history):
    // each event before its last branch point is marked with the ancestor it shares, and each
    // branch point with a divider.
    const record = state.run.branches.find((b) => b.index === logs.branch);
    const path = (record && record.path) || [];
    const events = await query({ condition, branch: logs.branch, up_to_vtime: logs.vtime_ns / 1e9 + 2, limit: 5000 });
    const marked = [];
    let step = 0;
    for (const event of events) {
      while (step < path.length && event.vtime_ns > path[step].vtime_ns) {
        marked.push({ divider: true, branch: path[step].branch, vtime_ns: path[step].vtime_ns });
        step += 1;
      }
      marked.push(step < path.length ? { ...event, inherited: path[step].branch } : event);
    }
    logs.events = marked;
  } catch (error) { logs.error = error.message; }
  const body = $("#logs .body");
  if (body) { body.innerHTML = logsBody(); logsWire(); }
  const here = $("#logs tr.here");
  if (here) here.scrollIntoView({ block: "center" });
}
function logsBody() {
  const logs = state.logs;
  if (!logs) return `<div class="empty">Pick a property example, a search result or a timeline on the map.</div>`;
  const events = logs.events || [];
  let hereIndex = -1;
  events.forEach((event, i) => { if (!event.divider && event.vtime_ns <= logs.vtime_ns) hereIndex = i; });
  return `<div style="display:flex;gap:8px;margin-bottom:8px;align-items:center">
      <input id="logs-filter" style="flex:1" placeholder="Filter this timeline (a condition), e.g. output.source=postgres" value="${escape(logs.filter)}">
      <button id="logs-apply">Filter</button></div>
    <div class="logs">${logs.events === null ? `<div class="empty">Loading…</div>` : `<table>${events.map((event, i) => {
      if (event.divider) {
        return `<tr><td colspan="3" style="color:var(--accent);font-family:system-ui;padding:6px 8px">↳ branched from #${event.branch} at ${seconds(event.vtime_ns)}: what follows is this timeline's own</td></tr>`;
      }
      const { kind, text, css } = describe(event.event);
      const from = event.inherited !== undefined ? `<span class="kind" title="Shared with #${event.inherited}: before this timeline branched">#${event.inherited}</span> ` : "";
      return `<tr class="${i === hereIndex ? "here" : ""}" style="${event.inherited !== undefined ? "opacity:.75" : ""}"><td class="muted">${seconds(event.vtime_ns)}</td>
        <td>${from}<span class="kind ${css}">${escape(kind)}</span></td><td>${escape(text)}</td></tr>`;
    }).join("")}</table>`}</div>
    ${logs.error ? `<div class="fail-text">${escape(logs.error)}</div>` : ""}
    <div style="margin-top:12px"><div class="group-title">At this moment (branch ${logs.branch}, ${seconds(logs.vtime_ns)})</div>
      <div style="display:flex;gap:8px"><input id="moment-command" style="flex:1" placeholder="A command to run there, e.g. det-nodes exec redis redis-cli get balance:0">
        <label class="muted" style="display:flex;align-items:center;gap:4px">rewind <input id="moment-rewind" type="number" min="0" value="0" style="width:72px"> ms</label>
        <button class="primary" id="moment-run">Run at this moment</button></div>
      <div class="muted" style="margin-top:4px">Replays the branch exactly to this moment and runs the command in the guest (or a node, with det-nodes exec).</div>
      <div style="display:flex;gap:8px;align-items:center;margin-top:8px"><button id="fork-run">Fork here</button>
        <input id="fork-branches" type="number" min="1" value="16" style="width:80px"><span class="muted">timelines from this moment: a subtree in the multiverse tree
        (<span class="mono">explore … --from-branch ${logs.branch} --from-vtime-ms ${Math.floor(logs.vtime_ns / 1e6)}</span>)</span></div>
      <pre class="output" id="moment-output" hidden></pre>
      <div style="display:flex;gap:8px;margin-top:8px"><input id="extract-node" style="width:140px" placeholder="node">
        <input id="extract-path" style="flex:1" placeholder="/path/in/the/node">
        <button id="extract-run">Extract the file</button></div>
      <div class="muted" id="extract-status"></div></div>`;
}
function logsWire() {
  const apply = $("#logs-apply");
  if (!apply) return;
  const filter = () => { state.logs.filter = $("#logs-filter").value.trim(); state.logs.events = null; logsLoad(); };
  apply.addEventListener("click", filter);
  $("#logs-filter").addEventListener("keydown", (event) => { if (event.key === "Enter") filter(); });
  $("#extract-run").addEventListener("click", async () => {
    const node = $("#extract-node").value.trim(), path = $("#extract-path").value.trim();
    if (!node || !path) return;
    $("#extract-status").textContent = "Replaying to the moment…";
    const response = await fetch(`/runs/${state.runId}/extract`, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ branch: state.logs.branch, at_vtime_ms: Math.floor(state.logs.vtime_ns / 1e6), node, path }),
    });
    if (!response.ok) { $("#extract-status").textContent = await response.text(); return; }
    const blob = await response.blob();
    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = path.split("/").pop() || "file";
    link.click();
    $("#extract-status").textContent = `${blob.size} bytes, as they were at this moment.`;
  });
  $("#fork-run").addEventListener("click", async () => {
    const info = state.run.run || {};
    const request = { scenario: info.scenario, profile: info.profile, strategy: info.strategy || undefined,
      branches: Math.max(1, Number($("#fork-branches").value) || 16),
      from_branch: state.logs.branch, from_vtime_ms: Math.floor(state.logs.vtime_ns / 1e6) };
    if (info.program) request.program = info.program; else request.compose = info.compose;
    // Seeds are 64-bit: written into the JSON as an exact integer.
    const body = JSON.stringify({ ...request, seed: 0 }).replace('"seed":0', `"seed":${BigInt("0x" + (info.seed || "0"))}`);
    const response = await fetch("/runs", { method: "POST", headers: { "Content-Type": "application/json" }, body });
    if (!response.ok) { $("#moment-output").hidden = false; $("#moment-output").textContent = await response.text(); return; }
    const created = await response.json();
    await runsRefresh();
    runOpen(created.id);
  });
  $("#moment-run").addEventListener("click", async () => {
    const output = $("#moment-output");
    output.hidden = false;
    output.textContent = "Replaying to the moment…";
    try {
      const rewind = Math.max(0, Number($("#moment-rewind").value) || 0);
      const text = await api(`/runs/${state.runId}/replay`, {
        branch: state.logs.branch, at_vtime_ms: Math.max(0, Math.floor(state.logs.vtime_ns / 1e6) - rewind),
        exec: $("#moment-command").value || undefined,
      });
      output.textContent = momentOutput(text);
    } catch (error) { output.textContent = error.message; }
  });
}
// Notebook --------------------------------------------------------------------------------
// Clojure cells, evaluated in order by babashka on the server (serve.zig, notebook.clj), as
// Antithesis's notebook: what a cell defines, later cells use. Built-ins: run, query, events,
// md, and actions, which run only when clicked here: replay, stacks, profile, extract; an
// action's result (result action) is there for later cells once it ran.
const cellSeparator = "\n;; %%\n";
const notebookTemplate = [
  '(md "# Run notes\\nWhat failed, where, and what the system looked like there.")',
  '(def failures (query "assert.condition=false" {:limit 20}))\nfailures',
  '(def first-failure (first failures))\n(def nodes (map :name (-> run :run :system :nodes)))\n' +
    '(if first-failure\n  (println "first failure: branch" (:branch first-failure) "at" (/ (:vtime_ns first-failure) 1e9) "s")\n  (println "no failures"))\n' +
    '(frequencies (map #(get-in % [:event :assert :message]) failures))',
  '(when (and first-failure (seq nodes))\n  (stacks {:branch (:branch first-failure) :at_vtime_ms (quot (:vtime_ns first-failure) 1000000) :node (first nodes)}))',
].join(cellSeparator);

async function notebookOpen() {
  if (!state.notebook || state.notebook.runId !== state.runId) {
    let source = null;
    try { source = (await apiJson(`/runs/${state.runId}/notebook`)).source; } catch { /* none yet */ }
    state.notebook = { runId: state.runId, cells: (source || notebookTemplate).split(cellSeparator),
      results: new Map(), cache: new Map(), saved: source !== null, timer: null, generation: 0 };
  }
  notebookDraw();
  notebookEvaluate();
}

function notebookDraw() {
  const book = state.notebook;
  $("#notebook").innerHTML = `<div class="notebook-bar">
      <button class="primary" id="notebook-save">Save</button>
      <span class="muted" id="notebook-state">${book.saved ? "saved with the run" : "not saved"}</span>
      <button id="notebook-nrepl" title="A babashka nREPL server with these names, for your editor">nREPL</button>
      <span class="muted" style="margin-left:auto">Clojure (babashka): run · query · events · md · replay · stacks · profile · extract · result</span></div>
    <div class="cell" id="nrepl-help" hidden style="padding:10px 14px;font-size:13px"></div>
    ${book.cells.map((code, index) => `<div class="cell" data-index="${index}">
      <textarea spellcheck="false" rows="${Math.max(2, code.split("\n").length)}">${escape(code)}</textarea>
      <div class="out"></div>
      <div class="tools"><button data-do="above">+ above</button><button data-do="below">+ below</button>
        <button data-do="delete">delete</button></div></div>`).join("")}`;
  $("#notebook-save").addEventListener("click", notebookSave);
  $("#notebook-nrepl").addEventListener("click", async () => {
    try {
      const { port } = await apiJson(`/runs/${book.runId}/nrepl`, {});
      $("#nrepl-help").hidden = false;
      $("#nrepl-help").innerHTML = `<b>nREPL for run ${book.runId}</b> on the server's 127.0.0.1:${port} (babashka; the notebook's names are in
        <span class="mono">user</span>, and actions such as <span class="mono">(replay {...})</span> run at once and return their output).<br>
        Tunnel it, then connect your editor (CIDER, Calva, Conjure, Cursive) to localhost:${port}:
        <pre class="output">ssh -N -L ${port}:127.0.0.1:${port} &lt;you&gt;@&lt;server&gt;
clj -Sdeps '{:deps {nrepl/nrepl {:mvn/version "1.8.0"}}}' -M -m nrepl.cmdline --connect --host 127.0.0.1 --port ${port}</pre>`;
    } catch (error) { $("#nrepl-help").hidden = false; $("#nrepl-help").textContent = error.message; }
  });
  document.querySelectorAll("#notebook .cell[data-index]").forEach((cell) => {
    const index = Number(cell.dataset.index);
    $("textarea", cell).addEventListener("input", (event) => {
      book.cells[index] = event.target.value;
      book.saved = false;
      $("#notebook-state").textContent = "not saved";
      clearTimeout(book.timer);
      book.timer = setTimeout(notebookEvaluate, 500);
    });
    cell.querySelectorAll(".tools button").forEach((button) => button.addEventListener("click", () => {
      const what = button.dataset.do;
      if (what === "delete") book.cells.splice(index, 1);
      else book.cells.splice(what === "above" ? index : index + 1, 0, "");
      if (book.cells.length === 0) book.cells.push("");
      book.saved = false;
      notebookDraw();
      notebookEvaluate();
    }));
  });
}

async function notebookSave() {
  const book = state.notebook;
  const response = await fetch(`/runs/${book.runId}/notebook`, {
    method: "PUT", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ source: book.cells.join(cellSeparator) }),
  });
  book.saved = response.ok;
  $("#notebook-state").textContent = response.ok ? "saved with the run" : await response.text();
}

// Evaluates every cell on the server; an edit meanwhile starts a new generation.
async function notebookEvaluate() {
  const book = state.notebook;
  const generation = ++book.generation;
  const outputs = [...document.querySelectorAll("#notebook .cell[data-index] .out")];
  outputs.forEach((out) => { out.innerHTML = `<span class="muted">…</span>`; });
  let answer;
  try {
    answer = await apiJson(`/runs/${book.runId}/notebook/evaluate`,
      { cells: book.cells, results: Object.fromEntries(book.results) });
  } catch (error) {
    if (generation === book.generation) outputs.forEach((out, i) => { out.innerHTML = i ? "" : `<div class="error">${escape(error.message)}</div>`; });
    return;
  }
  if (generation !== book.generation) return;
  answer.cells.forEach((cell, index) => {
    const out = outputs[index];
    if (!out) return;
    cell.outputs.forEach((output, i) => { output.__index = i; });
    out.innerHTML = cell.outputs.map((output) => outputHtml(output, index)).join("");
    out.querySelectorAll(".action button").forEach((button) => button.addEventListener("click", () =>
      actionRun(book, cell.outputs[Number(button.dataset.output)], button)));
  });
}

function outputHtml(output, cellIndex) {
  switch (output.type) {
    case "md": return `<div class="md">${markdown(output.text)}</div>`;
    case "text": return `<pre>${escape(output.text)}</pre>`;
    case "edn": return `<pre class="edn">${escape(output.text)}</pre>`;
    case "error": return `<div class="error">${escape(output.text)}</div>`;
    case "events": return valueHtml(output.events) + (output.count > output.events.length ? `<div class="muted">first ${output.events.length} of ${output.count}</div>` : "");
    case "action": {
      const done = output.result != null;
      return `<div class="action"><button data-output="${output.__index}">${done ? "Run again" : "Run"}</button>
        <span class="mono">${escape(output.label)}</span></div>${done ? valueHtml(actionShown(output.result)) : ""}`;
    }
    default: return `<pre>${escape(JSON.stringify(output))}</pre>`;
  }
}

// What an action result looks like: a replay's output as text, a file as its link.
const downloads = new Map();
function actionShown(result) {
  if (result && result.bytes !== undefined) return { ...result, url: downloads.get(result.name) };
  return result;
}

async function actionRun(book, output, button) {
  button.disabled = true;
  button.textContent = "Running…";
  const { path, body } = output.request;
  try {
    if (path === "extract") {
      const response = await fetch(`/runs/${book.runId}/extract`, {
        method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body),
      });
      if (!response.ok) throw new Error(await response.text());
      const blob = await response.blob();
      const name = body.path.split("/").pop() || "file";
      downloads.set(name, URL.createObjectURL(blob));
      book.results.set(output.label, { bytes: blob.size, name });
    } else {
      book.results.set(output.label, momentOutput(await api(`/runs/${book.runId}/${path}`, body)));
    }
  } catch (error) { book.results.set(output.label, `error: ${error.message}`); }
  notebookEvaluate();
}

// A value as the notebook shows it: events as a log table, files as links, text as is.
function valueHtml(value) {
  if (value instanceof Error) return `<div class="error">${escape(value.message)}</div>`;
  if (typeof value === "string") return `<pre>${escape(value)}</pre>`;
  if (Array.isArray(value) && value.length && value.every((item) => item && item.event !== undefined && item.vtime_ns !== undefined)) {
    return `<div class="logs" style="max-height:300px"><table>${value.map((item) => {
      const { kind, text, css } = describe(item.event);
      return `<tr><td class="muted">${item.branch !== undefined ? "#" + item.branch : ""}</td><td class="muted">${seconds(item.vtime_ns)}</td>
        <td><span class="kind ${css}">${escape(kind)}</span></td><td>${escape(text)}</td></tr>`;
    }).join("")}</table></div><div class="muted">${value.length} events</div>`;
  }
  if (value && value.url && value.bytes !== undefined) {
    return `<a href="${value.url}" download="${escape(value.name)}">${escape(value.name)}</a> <span class="muted">${value.bytes} bytes</span>`;
  }
  return `<pre>${escape(JSON.stringify(value, null, 2))}</pre>`;
}

// Markdown enough for notes: headings, lists, code, bold, italics, paragraphs.
function markdown(text) {
  const inline = (line) => escape(line).replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>").replace(/\*([^*]+)\*/g, "<i>$1</i>");
  return text.split("\n").map((line) => {
    const heading = /^(#{1,3}) (.*)$/.exec(line);
    if (heading) return `<h${heading[1].length}>${inline(heading[2])}</h${heading[1].length}>`;
    if (/^[-*] /.test(line)) return `<li>${inline(line.slice(2))}</li>`;
    return line.trim() ? `<p style="margin:4px 0">${inline(line)}</p>` : "";
  }).join("");
}

// From a replay's output: what the command printed, then determinismo's own lines.
function momentOutput(text) {
  const printed = [], other = [];
  for (const line of text.split("\n")) {
    const at = line.indexOf('{"event":"exec_output"');
    if (at >= 0) { try { printed.push(JSON.parse(line.slice(at)).details.text); } catch { /* skip */ } }
    else if (line.startsWith("[determinismo]") || line.startsWith("[branch")) other.push(line);
  }
  return (printed.join("") || "(no output)") + "\n\n" + other.join("\n");
}

// One line for an event, whatever its kind.
function describe(event) {
  if (!event || typeof event !== "object") return { kind: "text", text: String(event), css: "" };
  if (event.output) return { kind: `${event.output.source} ${event.output.stream}`, text: event.output.text, css: "output" };
  if (event.assert) {
    const failed = event.assert.condition === false && ["always", "always_or_unreachable"].includes(event.assert.type)
      || event.assert.type === "unreachable";
    return { kind: event.assert.type, text: `${event.assert.message}${event.assert.condition === false ? " (false)" : ""} ${JSON.stringify(event.assert.details || {})}`, css: failed ? "assert-fail" : "assert" };
  }
  if (event.antithesis_assert) {
    const a = event.antithesis_assert;
    return { kind: a.display_type || "assert", text: `${a.message}${a.condition === false ? " (false)" : ""}`, css: a.condition === false ? "assert-fail" : "assert" };
  }
  if (event.event) {
    const css = event.event === "fault" ? "fault" : event.event.startsWith("command") ? "command" : "";
    return { kind: event.event, text: JSON.stringify(event.details || {}), css };
  }
  if (event.lifecycle) return { kind: "lifecycle", text: event.lifecycle, css: "" };
  return { kind: "event", text: JSON.stringify(event), css: "" };
}

// New runs --------------------------------------------------------------------------------
$("#new-run").addEventListener("click", () => $("#run-dialog").showModal());
// An uploaded strategy is kept by the server; runs name it as @name.
$("#strategy-file").addEventListener("change", async (event) => {
  const file = event.target.files[0];
  if (!file) return;
  const name = file.name.replace(/[^A-Za-z0-9._-]/g, "_").replace(/^\.+/, "");
  $("#strategy-status").textContent = `Uploading ${name}…`;
  const response = await fetch(`/strategies/${encodeURIComponent(name)}`, { method: "PUT", body: file });
  if (!response.ok) { $("#strategy-status").textContent = await response.text(); return; }
  const { strategy } = await response.json();
  $("#run-form").elements.strategy.value = strategy;
  $("#strategy-status").textContent = `Uploaded: this run uses ${strategy} (add arguments after it).`;
});
$("#run-form").addEventListener("submit", async (event) => {
  if (event.submitter && event.submitter.value === "cancel") return;
  const form = new FormData($("#run-form"));
  const request = { [form.get("kind")]: form.get("path"), seed: Number(form.get("seed")) };
  if (form.get("branches")) request.branches = Number(form.get("branches"));
  for (const key of ["scenario", "profile", "strategy", "time_budget", "timeline"]) if (form.get(key)) request[key] = form.get(key);
  request.branching = request.strategy ? "flat" : form.get("branching");
  if (form.get("jobs")) request.jobs = Number(form.get("jobs"));
  try {
    const created = await apiJson("/runs", request);
    await runsRefresh();
    runOpen(created.id);
  } catch (error) { alert(error.message); }
});

runsRefresh();
setInterval(runsRefresh, 5000);
const fromHash = Number(location.hash.slice(1));
if (fromHash) runOpen(fromHash);
