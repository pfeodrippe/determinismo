# A Clojure service with a lost update, a socket REPL, and test commands in its image.
#   determinismo explore ... --compose examples/clojure-bank/compose.yaml --scenario bank
# Debug session: redefine the buggy function through the REPL at a moment, and continue:
#   determinismo explore ... --branch B --at-vtime-ms T --continue \
#     --exec "det-nodes exec bank /app/patch.sh"
services:
  bank:
    build: ./app
    ports:
      - "7000"
