# Jepsen's (jepsen-io/tidb, resources/tikv.conf): short Raft ticks and leases, and regions of at
# most 5 keys, so that they split and merge all the time.
[server]
status-addr = "0.0.0.0:20180"

[raftstore]
pd-heartbeat-tick-interval = "5s"
raft-store-max-leader-lease = "50ms"
raft-base-tick-interval = "100ms"
raft-heartbeat-ticks = 3
raft-election-timeout-ticks = 10
# Jepsen's: the log synced at each write (2.1's default too).
sync-log = true

[coprocessor]
region-max-keys = 5
region-split-keys = 3
# Three TiKVs share the machine: small caches (by default each column family's takes a share of
# its memory).
[rocksdb.defaultcf]
block-cache-size = "64MB"
[rocksdb.writecf]
block-cache-size = "32MB"
[rocksdb.lockcf]
block-cache-size = "16MB"
[raftdb.defaultcf]
block-cache-size = "16MB"
