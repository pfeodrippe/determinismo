# The client: its image holds the Antithesis test templates (/opt/antithesis/test/v1/counter/),
# which determinismo runs in this container.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: client
spec:
  replicas: 1
  selector:
    matchLabels:
      app: client
  template:
    metadata:
      labels:
        app: client
    spec:
      containers:
        - name: client
          image: localhost/determinismo-kubernetes-client:1
          command: ["sh", "-c", "while true; do sleep 3600; done"]
