# SPDX-License-Identifier: MIT
# Style, unit tests and a full build on every push and pull request. The end-to-end checks boot
# real VMs on the patched KVM, so they run on a self-hosted runner labeled `determinismo` (a
# host provisioned with infra/host/, guest artifacts in ~/guest), when dispatched by hand.
name: ci
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      e2e:
        description: Run the end-to-end checks on the self-hosted determinismo runner
        type: boolean
        default: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - run: zig build tidy
      - run: zig build test --summary all
      - run: zig build -Drelease

  e2e:
    if: github.event_name == 'workflow_dispatch' && inputs.e2e
    runs-on: [self-hosted, determinismo]
    steps:
      - uses: actions/checkout@v4
      - run: zig build -Drelease
      - run: guest/build-initramfs.sh zig-out/bin ~/guest/det_guest.ko ~/guest/base.cpio.zst
      - run: zig build -Drelease e2e
