# SPDX-License-Identifier: MIT
# The bank, written the Antithesis way: a Compose file, and test commands in the client image
# under /opt/antithesis/test/v1/bank/. Run with:
#   determinismo explore ... --compose tests/antithesis-compat/bank/compose.yaml --scenario bank
services:
  redis:
    image: docker.io/library/redis:7.4-alpine
    command: redis-server --save "" --appendonly no
    ports:
      - "6379"
  client:
    build: ./client
    command: [sleep, infinity]
    depends_on:
      - redis
