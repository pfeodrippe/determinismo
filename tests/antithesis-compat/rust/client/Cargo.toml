[package]
name = "maze-rust"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
determinismo = { path = "../sdk-rust", features = ["coverage"] }

# Debug information kept in the release build (Cargo strips it by default since 1.77, whatever
# RUSTFLAGS ask): the binary in /symbols gives the edges' source lines.
[profile.release]
debug = true
strip = false
