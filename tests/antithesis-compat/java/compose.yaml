# The maze on the JVM, for code coverage through the Java agent (sdk/java/DeterminismoCoverage):
#   determinismo explore ... --compose tests/antithesis-compat/java/compose.yaml --scenario maze \
#     --strategy "det-strategy-mutate --sync-dir <fresh dir>"
# The client's build context is the repository root so that its image can include sdk/java.
services:
  client:
    build:
      context: ../../..
      dockerfile: tests/antithesis-compat/java/client/Dockerfile
    command: [sleep, infinity]
